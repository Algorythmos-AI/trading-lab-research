<style>

  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #eef1f5; --surface-3: #e4e9ef;

  --accent: #1f5fcc; --accent-ink: #184ca3; --accent-soft: #e2ebfa;
  --good: #0ca30c; --good-ink: #0a7a0a; --good-soft: #e3f4e3;
  --warn: #fab219; --warn-ink: #8a5a00; --warn-soft: #fdf1d6;
  --serious: #ec835a; --serious-ink: #a8431b; --serious-soft: #fbe7de;
  --bad: #d03b3b; --bad-ink: #b02e2e; --bad-soft: #f9e1e1;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100;
  --shadow: 0 1px 2px rgba(16, 25, 35, .06);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b1016; --surface: #121921; --surface-2: #18212b; --surface-3: #202b37;
    --ink: #e7ecf1; --ink-2: #b3bec9; --muted: #8692a0; --line: #25303c; --line-2: #33404e;
    --accent: #6e9bff; --accent-ink: #9dbbff; --accent-soft: #1a2942;
    --good-ink: #4cc38a; --good-soft: #10291c; --warn-ink: #f2c35a; --warn-soft: #2e2410;
    --serious-ink: #f09a78; --serious-soft: #2f1c14; --bad-ink: #f07a7a; --bad-soft: #321718;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1016; --surface: #121921; --surface-2: #18212b; --surface-3: #202b37;
  --ink: #e7ecf1; --ink-2: #b3bec9; --muted: #8692a0; --line: #25303c; --line-2: #33404e;
  --accent: #6e9bff; --accent-ink: #9dbbff; --accent-soft: #1a2942;
  --good-ink: #4cc38a; --good-soft: #10291c; --warn-ink: #f2c35a; --warn-soft: #2e2410;
  --serious-ink: #f09a78; --serious-soft: #2f1c14; --bad-ink: #f07a7a; --bad-soft: #321718;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
  --shadow: none;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { font-family: var(--display); font-stretch: 88%; text-wrap: balance; margin: 0; letter-spacing: -.005em; }
h2 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 20px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 13px; }
.clocks { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.clock { padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); white-space: nowrap; }
.clock em { font-style: normal; color: var(--muted); margin-right: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font: 600 12px var(--body); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.s-good { color: var(--good-ink); background: var(--good-soft); }
.s-warn { color: var(--warn-ink); background: var(--warn-soft); }
.s-serious { color: var(--serious-ink); background: var(--serious-soft); }
.s-bad { color: var(--bad-ink); background: var(--bad-soft); }
.s-neutral { color: var(--ink-2); background: var(--surface-2); }
.s-accent { color: var(--accent-ink); background: var(--accent-soft); }
.t-good { color: var(--good-ink); } .t-warn { color: var(--warn-ink); } .t-bad { color: var(--bad-ink); } .t-neutral { color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; color: var(--ink-2); font: 600 13px var(--body); padding: 8px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--mono); font-size: 11px; margin-left: 5px; padding: 0 5px; border-radius: 4px; background: var(--bad-soft); color: var(--bad-ink); }

main { padding-block: 18px 40px; }
.banner { margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
.stack { display: grid; gap: 16px; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; padding: 14px 16px 0; flex-wrap: wrap; }
.panel-head .sub { color: var(--muted); font-size: 12.5px; }
.panel-body { padding: 12px 16px 16px; min-width: 0; }
.panel-error { padding: 12px 16px 16px; color: var(--bad-ink); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.hero { display: grid; gap: 6px; padding-block: 4px; }
.hero h1 { font-size: clamp(22px, 3.2vw, 30px); font-weight: 750; line-height: 1.2; max-width: 36ch; }
.hero p { color: var(--ink-2); max-width: 82ch; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { padding: 12px 14px; display: grid; gap: 2px; align-content: start; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.kpi .label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.kpi .value { overflow-wrap: anywhere; font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
.kpi .unit { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 5px; letter-spacing: 0; }
.kpi .detail { font-size: 12px; color: var(--muted); }
.ico { width: 14px; height: 14px; flex: none; }

.actions { list-style: none; margin: 0; padding: 0; display: grid; }
.action { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.action:first-child { border-top: 0; padding-top: 2px; }
.rank { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); padding-top: 1px; }
.action > div { min-width: 0; }
.action-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-weight: 600; }
.action p { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.cmd { display: flex; margin-top: 6px; max-width: 100%; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 6px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px 0 0 6px; }
.cmd button { border: 1px solid var(--line); border-left: 0; background: var(--surface); color: var(--ink-2); font: 600 12px var(--body); padding: 0 10px; border-radius: 0 6px 6px 0; cursor: pointer; }
.cmd button:hover { color: var(--ink); background: var(--surface-2); }

.ladder { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.gate { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.gate.here { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.gate .gid { font-family: var(--mono); font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; align-items: center; flex-wrap: wrap; }
.gate .gname { font-weight: 600; font-size: 13px; line-height: 1.3; }
.gate .crit { font-size: 11.5px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
.here-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 980px) { .ladder { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); } }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.nowrap { white-space: nowrap; }

.dp-row { display: grid; grid-template-columns: minmax(130px, 34%) 1fr; align-items: center; gap: 10px; padding: 3px 4px; border-radius: 6px; }
.dp-row:hover, .dp-row:focus-visible { background: var(--surface-2); }
.dp-label { font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; }
.dp-label .n { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.dp-track { position: relative; height: 22px; }
.dp-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); }
.dp-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.dp-ci { position: absolute; top: 10px; height: 2px; border-radius: 2px; }
.dp-dot { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.dp-axis { display: grid; grid-template-columns: minmax(130px, 34%) 1fr; gap: 10px; margin-top: 4px; padding-inline: 4px; }
.dp-ticks { position: relative; height: 18px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.dp-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.readout { margin-top: 10px; min-height: 42px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.sq { border-radius: 2px; }
.c-candidate { background: var(--good); } .c-inconclusive { background: var(--warn); }
.c-rejected { background: var(--bad); } .c-falsified { background: var(--serious); } .c-not_applicable { background: var(--muted); }
.vdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.bar { position: relative; height: 10px; border-radius: 5px; background: var(--surface-3); overflow: hidden; display: flex; gap: 2px; }
.bar > span { height: 100%; flex: none; }
.meter { position: relative; height: 12px; border-radius: 6px; background: var(--surface-3); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.meter .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.row-bars { display: grid; gap: 10px; }
.row-bar { display: grid; grid-template-columns: minmax(110px, 30%) 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.row-bar .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; font-weight: 500; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.logline { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-left: 2px solid var(--line-2); overflow-wrap: anywhere; color: var(--ink-2); }
details > summary { cursor: pointer; font-weight: 600; font-size: 13px; padding: 6px 0; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 8px; }
.stage { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 3px; align-content: start; }
.stage .t { font-family: var(--mono); font-weight: 600; }
.stage .big { font-family: var(--mono); font-size: 20px; font-weight: 600; line-height: 1.2; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.timeline li:first-child { border-top: 0; }
.foot { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.src { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.src .dot { width: 7px; height: 7px; border-radius: 50%; }
.d-ok { background: var(--good); } .d-stale { background: var(--warn); } .d-fail { background: var(--bad); }
@media (max-width: 560px) {
  .dp-row, .dp-axis { grid-template-columns: 1fr; gap: 2px; }
  .dp-axis > div:first-child { display: none; }
  .row-bar { grid-template-columns: 1fr auto; }
  .row-bar > .bar, .row-bar > .meter { grid-column: 1 / -1; grid-row: 2; }
  .timeline li { grid-template-columns: 1fr; gap: 0; }
  .kpi .value { font-size: 20px; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><b>TRADING LAB</b><span>Control room</span></div>
      <div class="clocks" id="clocks"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

          table([
            { label: "#", get: function (x) { return x.number ? "#" + x.number : "—"; }, nowrap: true },
            { label: "Issue", get: function (x) { return x.title; } },
            { label: "Priority", get: function (x) { return pill(x.priority, x.priority === "P0" ? "bad" : x.priority === "P1" ? "serious" : "neutral"); } },
            { label: "Size", get: function (x) { return x.size; } },
            { label: "Area", get: function (x) { return x.area; } }
          ], by[k])));
      });
    }));
    pane.appendChild(panel("Recent CI runs on the org repo", null, function (b) {
      var runs = arr(p.runs).slice(0, 8);
      if (!runs.length) { missing(b, "CI data"); return; }
      add(b, table([
        { label: "Workflow", get: function (x) { return x.workflow; } },
        { label: "Result", get: function (x) { return pill(x.conclusion || "running", x.conclusion === "success" ? "good" : x.conclusion === "failure" ? "bad" : "neutral"); } },
        { label: "Branch", get: function (x) { return h("span", { class: "mono" }, x.branch || ""); } },

  }

  // ------------------------------------------------------------ operations
  function logBlock(dig) {
    if (!dig || !dig.exists) return h("p", { class: "small muted" }, "No log file yet.");

  }
  function meterRow(label, pct, color, markPct, value, aria) {
    return h("div", { class: "row-bar" }, h("span", null, label),
      h("div", { class: "meter", role: "img", "aria-label": aria || value },
        h("span", { class: "fill", style: "width:" + Math.max(0, Math.min(100, pct)) + "%;background:" + color }),
        isNum(markPct) ? h("span", { class: "mark", style: "left:" + markPct + "%" }) : null),

  }
  function renderOps() {
    var o = state.docs.ops;

      panel("Tonight's jobs", "launchd agents on this Mac", function (b) {

          { label: "Job", get: function (j) { return h("div", null, h("b", null, j.name), h("div", { class: "small muted mono" }, j.label)); } },
          { label: "Starts", get: function (j) { return j.local_time + " Sydney"; }, nowrap: true },
          { label: "State", get: function (j) { return !j.loaded ? pill("Not loaded", "bad") : j.running ? pill("Running", "accent", true) : pill("Idle", "neutral"); }, nowrap: true },
          { label: "Last exit", get: function (j) { return isNum(j.last_exit) ? pill(String(j.last_exit), j.last_exit === 0 ? "good" : "warn") : "—"; } }
        ], jobs));
        if (host.jobs_error) add(b, h("p", { class: "small muted" }, host.jobs_error));
        add(b, h("p", { class: "small muted", style: "margin-top:8px" }, "Last exit belongs to the job's previous run. A running job has already restarted."));
      }),
      panel("Live code", "What launchd actually runs", function (b) {
        var d = o.deployed; if (!d) { missing(b, "Deployed checkout data"); return; }
        add(b, h("dl", { class: "kv" },
          h("dt", null, "~/trading"), h("dd", { class: "mono" }, d.head + " (" + d.branch + ")"),
          h("dt", null, "GitHub main"), h("dd", { class: "mono" }, d.main || "unknown"),
          h("dt", null, "Status"), h("dd", null, d.behind === 0 ? pill("Up to date", "good") : isNum(d.behind) ? pill(d.behind + " commit(s) behind", "bad") : pill("Comparison unavailable", "warn")),
          h("dt", null, "Local changes"), h("dd", null, d.modified + " modified, " + d.untracked + " untracked")));
        if (arr(d.missing).length) {
          add(b, h("p", { class: "small", style: "margin-top:10px" }, "Missing from the live checkout:"));
          add(b, h("ul", { class: "small", style: "margin:4px 0 0;padding-left:18px" }, d.missing.map(function (c) { return h("li", null, h("span", { class: "mono" }, c.sha), " " + c.subject); })));
          add(b, h("p", { class: "small muted", style: "margin-top:8px" }, "Update after 06:40 Sydney, when no job is running:"));
          add(b, cmdBox("git -C ~/trading pull --ff-only"));
        }
        if (d.compare_error) add(b, h("p", { class: "small muted" }, d.compare_error));
      })));
    pane.appendChild(panel("Pre-market routine", o.routine && o.routine.date ? "Session " + o.routine.date + " (New York date)" : "No routine output yet", function (b) {
      var r = o.routine; if (!r || !arr(r.stages).length) { missing(b, "Routine output"); return; }
      add(b, h("div", { class: "stages" }, r.stages.map(function (s) {
        if (s.error) return h("div", { class: "stage" }, h("span", { class: "t" }, s.file), h("span", { class: "small muted" }, s.error));
        var st = s.stats || {}, c = s.counts || {};
        return h("div", { class: "stage" },
          h("div", { style: "display:flex;justify-content:space-between;gap:6px;align-items:center" }, h("span", { class: "t" }, (s.as_of_et || "?") + " NY"), pill(String(s.feed || "?").toUpperCase(), s.feed === "iex" ? "warn" : "neutral")),
          h("span", { class: "small muted" }, s.stage),
          h("span", { class: "big" }, isNum(st.snapshot_symbols) ? String(st.snapshot_symbols) : "—"), h("span", { class: "small muted" }, "symbols in the snapshot"),
          h("span", { class: "small" }, "Kept " + (isNum(st.kept) ? st.kept : "—") + " · tier 1: " + (c.tier1 || 0) + (c.tier2 !== undefined ? " · tier 2: " + c.tier2 : "")),
          arr(s.tier1).length ? h("div", { class: "chips" }, s.tier1.map(function (t) { return h("span", { class: "chip" }, t.symbol + (isNum(t.score) ? " " + t.score : "")); })) : null,
          s.primary ? h("span", { class: "small" }, "Primary: ", h("b", null, s.primary)) : (s.stage === "tickets" ? h("span", { class: "small muted" }, "No primary") : null));
      })));
      if (arr(r.stages).some(function (s) { return s.feed === "iex"; })) add(b, h("p", { class: "small muted", style: "margin-top:10px" }, "IEX feed: the live checkout predates the hybrid SIP + IEX feed (PR #6), so pre-market coverage is thin."));
      add(b, h("div", { style: "margin-top:8px" }, logBlock(r.log)));
    }));
    pane.appendChild(h("div", { class: "grid-2" },
      panel("Paper B", "Strategy B on a US$600 virtual account", function (b) {
        var p = o.paper; if (!p) { missing(b, "Paper journal"); return; }
        var v = p.virtual || {}, g = p.g2 || {};
        add(b, h("dl", { class: "kv" },
          h("dt", null, "Virtual equity"), h("dd", { class: "num" }, isNum(v.equity) ? "US$" + num(v.equity, 2) + (isNum(v.start) ? " (start " + num(v.start, 2) + ")" : "") : "—"),
          h("dt", null, "Loss latch"), h("dd", null, v.latched ? pill("Latched: " + (v.latch_reason || ""), "bad") : pill("Clear", "good")),
          h("dt", null, "Sessions armed"), h("dd", null, String(p.armed_sessions) + (p.last_armed ? ", last " + p.last_armed : "")),
          h("dt", null, "Trades closed"), h("dd", null, String(p.trades) + (isNum(p.mean_r) ? ", mean " + signed(p.mean_r) + "R" : ""))));
        add(b, h("div", { class: "row-bars", style: "margin-top:12px" },
          meterRow("G2 trades", g.trades_needed ? 100 * g.trades / g.trades_needed : 0, "var(--accent)", null, g.trades + "/" + g.trades_needed),
          meterRow("G2 sessions", g.sessions_needed ? 100 * g.sessions / g.sessions_needed : 0, "var(--accent)", null, g.sessions + "/" + g.sessions_needed)));
        if (arr(p.recent).length) {
          add(b, h("p", { class: "eyebrow", style: "margin-top:14px;margin-bottom:4px" }, "Latest journal events"));
          add(b, table([
            { label: "Sydney", get: function (x) { return fmtTime(x.ts, "Australia/Sydney", true); }, nowrap: true },
            { label: "Event", get: function (x) { return h("span", { class: "mono" }, x.event); } },
            { label: "Detail", get: function (x) { return h("span", { class: "small" }, String(x.detail || "")); } }
          ], p.recent.slice().reverse().slice(0, 8)));
        }
        add(b, h("div", { style: "margin-top:8px" }, logBlock(p.log)));
      }),
      panel("Forward test", "Nightly re-run of the frozen candidates", function (b) {
        var f = o.forward; if (!f) { missing(b, "Forward-test data"); return; }
        if (!f.exists) add(b, h("p", null, "Not run yet. It starts about 20 minutes after the US close, when the paper session ends."));
        else add(b, h("dl", { class: "kv" },
          h("dt", null, "Sessions"), h("dd", null, f.sessions + (f.first ? " (" + f.first + " to " + f.last + ")" : "")),
          h("dt", null, "Errors"), h("dd", null, String(f.errors))));
        if (arr(f.strategies).length) add(b, table([
          { label: "Strategy", get: function (x) { return x.strategy; } },
          { label: "n", r: true, get: function (x) { return String(x.n); } },
          { label: "Mean", r: true, get: function (x) { return signed(x.mean_r) + "R"; } },
          { label: "Total", r: true, get: function (x) { return signed(x.total_r, 2) + "R"; } }
        ], f.strategies));
        if (f.latest_scorecard) add(b, h("p", { class: "small muted", style: "margin-top:8px" }, "Latest scorecard: " + f.latest_scorecard));
        add(b, h("div", { style: "margin-top:8px" }, logBlock(f.log)));
      })));
    pane.appendChild(h("div", { class: "grid-2" },
      panel("This Mac", "Disk, memory, wake schedule and clock changes", function (b) {
        var free = host.disk_free_gb, floor = host.disk_floor_gb || 3, sw = host.swap || null, warnPct = host.swap_warn_pct || 85;
        var rows = [];
        if (isNum(free)) rows.push(meterRow("Free disk", 100 * free / (floor * 2), free < floor ? "var(--bad)" : "var(--good)", 50, num(free, 1) + " GB, need " + floor, free + " GB free; " + floor + " GB needed"));
        if (sw) rows.push(meterRow("Swap used", sw.used_pct, sw.used_pct >= warnPct ? "var(--serious)" : "var(--accent)", warnPct, num(sw.used_gb, 1) + " of " + num(sw.total_gb, 0) + " GB"));
        add(b, h("div", { class: "row-bars" }, rows));
        add(b, h("p", { class: "eyebrow", style: "margin-top:14px;margin-bottom:4px" }, "Wake schedule"));
        var wakes = arr(host.wakes);
        add(b, h("p", { class: "small" }, wakes.length ? "Repeating wake: " + wakes.map(function (w) { return w.time + " " + w.days; }).join(", ") + "." : "No repeating wake is set."));
        arr(host.wake_coverage).forEach(function (c) {
          add(b, h("p", { class: "small", style: "margin-top:4px" }, c.covered ? pill("Covered", "good") : pill("Not covered", "warn"), " A wake shortly before " + c.needed + " Sydney."));
        });
        add(b, h("p", { class: "eyebrow", style: "margin-top:14px;margin-bottom:4px" }, "Clock changes"));
        arr((state.docs.meta || {}).dst).forEach(function (d) {
          add(b, h("p", { class: "small" }, h("b", null, d.zone), " moves from " + d.from_offset + " to " + d.to_offset + " on " + d.local_date + ", in " + d.days_away + " days."));
        });
        var sched = arr(host.schedule);
        var late = sched.filter(function (s) { return s.session && !s.ok; });
        add(b, h("p", { class: "small", style: "margin-top:6px" }, late.length ? pill(late.length + " late start(s) ahead", "bad") : pill("Both jobs start in time over the next 10 days", "good")));
        add(b, h("details", null, h("summary", null, "Job start times in New York time"),
          table([
            { label: "Job", get: function (s) { return h("span", { class: "mono small" }, String(s.job).replace("com.wt.", "")); } },
            { label: "Sydney", get: function (s) { return s.local; }, nowrap: true },
            { label: "New York", get: function (s) { return s.et; }, nowrap: true },
            { label: "Check", get: function (s) { return !s.session ? h("span", { class: "small muted" }, "No session") : s.ok ? pill("OK", "good") : pill("Late for " + s.must_start_before_et, "bad"); } }
          ], sched)));
      }),
      panel("Recent errors in the logs", "Newest routine, paper and forward logs", function (b) {
        var errs = arr(o.errors);
        if (!errs.length) { add(b, h("p", { class: "muted" }, "No error lines in the latest logs.")); return; }
        add(b, h("div", { style: "display:grid;gap:6px" }, errs.slice(-14).map(function (e) {
          return h("div", null, h("span", { class: "small muted mono" }, e.source), h("div", { class: "logline" }, e.line));
        })));
      })));
    if (o.account) pane.appendChild(panel("Alpaca paper account", "Read-only snapshot", function (b) {
      var a = o.account;
      add(b, h("dl", { class: "kv" }, ["equity", "cash", "buying_power", "daytrade_count", "status", "market_is_open"].filter(function (k) { return a[k] !== undefined && a[k] !== null; }).map(function (k) {
        return [h("dt", null, k.replace(/_/g, " ")), h("dd", { class: "num" }, String(a[k]))];
      }), h("dt", null, "positions"), h("dd", null, arr(a.positions).length ? arr(a.positions).map(function (p) {
        return p.symbol + " × " + p.qty + (isNum(p.unrealized_pl) ? " (" + signed(p.unrealized_pl, 2) + " unrealised)" : "");
      }).join(", ") : "none")));
    }));
    return pane;
  }

  // ------------------------------------------------------------ history
  function renderHistory() {
    var hi = state.docs.history;
    var pane = h("div", { class: "stack" });
    if (!hi) { missing(pane, "History data"); return pane; }
    pane.appendChild(panel("Legacy gap-and-go pipeline", "April to July 2026, before the trading freeze", function (b) {
      var L = hi.legacy; if (!L) { missing(b, "Legacy run logs"); return; }
      add(b, h("p", { style: "margin-bottom:12px" }, L.total + " scheduled runs from " + L.first + " to " + L.last + ". Orders placed: ", h("b", null, String(L.orders_placed)), "."));
      var cats = [["safety_abort", "var(--cat-2)", "Safety abort (fired outside market hours)"], ["no_trade", "var(--cat-1)", "Evaluated, no trade"], ["no_candidates", "var(--cat-3)", "No candidates"], ["other", "var(--cat-4)", "Other"]];
      var totals = arr(L.by_month).map(function (m) { return cats.reduce(function (s, c) { return s + (m[c[0]] || 0); }, 0); });
      var maxTot = Math.max.apply(null, totals.concat([1]));
      add(b, h("div", { class: "row-bars" }, arr(L.by_month).map(function (m, i) {
        return h("div", { class: "row-bar" }, h("span", { class: "mono" }, m.month),
          h("div", { class: "bar", style: "background:transparent" }, cats.filter(function (c) { return m[c[0]]; }).map(function (c) {
            return h("span", { style: "width:calc(" + (100 * m[c[0]] / maxTot) + "% - 2px);background:" + c[1], title: c[2] + ": " + m[c[0]] });
          })),
          h("span", { class: "v" }, totals[i] + " runs"));
      })));
      add(b, h("div", { class: "legend" }, cats.map(function (c) { return h("span", null, h("i", { class: "sq", style: "background:" + c[1] }), c[2]); })));
      add(b, h("details", { style: "margin-top:10px" }, h("summary", null, "Counts by outcome"),
        table([{ label: "Outcome", get: function (x) { return x[0]; } }, { label: "Runs", r: true, get: function (x) { return String(x[1]); } }],
          cats.map(function (c) { return [c[2], (L.by_outcome || {})[c[0]] || 0]; }))));
    }));
    pane.appendChild(h("div", { class: "grid-2" },
      panel("Timeline", null, function (b) {
        add(b, h("ol", { class: "timeline" }, arr(hi.timeline).map(function (t) { return h("li", null, h("span", { class: "mono small" }, t.date), h("span", null, t.event)); })));
      }),
      panel("Repositories", null, function (b) {
        add(b, table([
          { label: "Repository", get: function (r) { return link(r.url, r.repo) || r.repo; } },
          { label: "Visibility", get: function (r) { return r.error ? pill("Unavailable", "warn") : pill(r.visibility, r.visibility === "public" ? "warn" : "neutral"); } },
          { label: "Last push", get: function (r) { return r.pushed_at ? ago(r.pushed_at) : "—"; }, nowrap: true },
          { label: "Open PRs", r: true, get: function (r) { return String(arr(r.open_prs).length); } }
        ], arr(hi.repos)));
        var reg = hi.registration_pr;
        if (reg) add(b, h("p", { class: "small", style: "margin-top:10px" }, "Catalog registration ", link(reg.url, reg.repo + "#" + reg.number) || (reg.repo + "#" + reg.number), ": ", pill(reg.state || "unknown", reg.state === "MERGED" ? "good" : "warn")));
      })));
    return pane;
  }

  // ------------------------------------------------------------ frame
  function renderFooter() {
    var m = state.docs.meta || {};
    var srcs = m.sources || {};
    return h("footer", { class: "foot" },
      h("div", { class: "srcs" }, Object.keys(srcs).map(function (k) {
        var s = srcs[k] || {};
        var cls = !s.ok ? "d-fail" : s.stale ? "d-stale" : "d-ok";
        var tip = !s.ok ? "Unavailable: " + (s.error || "") : s.stale ? "Last good result from " + ago(s.as_of) + ". Latest error: " + (s.error || "") : "Fresh";
        return h("span", { class: "src", title: tip }, h("span", { class: "dot " + cls }), k);
      })),
      h("div", null, (isNum(m.fresh_sources) ? m.fresh_sources + " of " + m.total_sources + " sources fresh. " : "") +
        "Built " + (m.as_of_sydney || "—") + " (" + (m.as_of_et || "—") + ") in " + (isNum(m.duration_s) ? m.duration_s + " s" : "—") +
        ". Refreshes every " + (m.refresh_minutes || 15) + " minutes while the Claude session runs. " +
        (state.live ? "Live updates on." : state.db === "unavailable" ? "Live updates unavailable; showing the published snapshot." : "Connecting to live updates.") +
        (m.collector && m.collector.sha ? " Collector " + m.collector.branch + "@" + m.collector.sha + "." : "") + " Run " + (m.run_id || "—") + "."),
      h("div", null, "Paper trading only. Nothing on this page is financial advice."));
  }
  var RENDER = { overview: renderOverview, research: renderResearch, spec: renderSpec, platform: renderPlatform, ops: renderOps, history: renderHistory };
  function render() {
    state.pending = false;
    var main = document.getElementById("main");
    var frag = document.createDocumentFragment();
    var bad = DOCS.map(function (k) { return state.docs[k] && state.docs[k].schema_version; }).filter(function (v) { return v !== undefined && v !== EXPECTED_SCHEMA; });
    if (bad.length) frag.appendChild(h("div", { class: "banner s-warn" }, "This page expects data version " + EXPECTED_SCHEMA + " but received version " + bad[0] + ". Some panels may be incomplete until the page is republished."));
    var meta = state.docs.meta || {};
    if (meta.last_error) frag.appendChild(h("div", { class: "banner s-bad" }, "The last refresh failed (" + ago(meta.last_attempt) + "): " + meta.last_error + ". The figures below are from the last good refresh, " + ago(meta.as_of) + "."));
    TABS.forEach(function (t) {
      var pane;
      try { pane = RENDER[t.id](); } catch (e) { pane = h("div", { class: "panel-error" }, "This section could not be drawn: " + (e && e.message)); }
      var wrap = h("div", { id: "pane-" + t.id, role: "tabpanel", "aria-labelledby": "tab-" + t.id }, pane);
      wrap.hidden = t.id !== state.tab;
      frag.appendChild(wrap);
    });
    frag.appendChild(renderFooter());
    main.replaceChildren(frag);
    renderTabs();
    selectTab(state.tab, false);
    renderClocks();
  }
  function schedule() { if (state.pending) return; state.pending = true; setTimeout(render, 80); }

  // ------------------------------------------------------------ live data
  function subscribe(db, name, attempt) {
    var ref;
    try { ref = db.doc("status/" + name); } catch (e) { return; }
    try {
      ref.onSnapshot(function (snap) {
        if (!snap || !snap.exists) return;
        var d = snap.data();
        if (d && typeof d === "object") { state.docs[name] = d; state.live = true; schedule(); }
      }, function (err) {
        var code = err && err.code;
        if (code === "revoked" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") { state.db = "unavailable"; state.live = false; schedule(); return; }
        if (attempt < 3) setTimeout(function () { subscribe(db, name, attempt + 1); }, 30000 * (attempt + 1));
        else { state.db = "unavailable"; schedule(); }
      });
    } catch (e) { state.db = "unavailable"; schedule(); }
  }
  function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { state.db = "unavailable"; schedule(); return; }
    Promise.resolve().then(function () { return c.use("db"); }).then(function (db) {
      if (!db) { state.db = "unavailable"; schedule(); return; }
      state.db = "live";
      DOCS.forEach(function (n) { subscribe(db, n, 0); });
    }, function () { state.db = "unavailable"; schedule(); });
  }

  var initial = (location.hash || "").replace("#", "");
  if (!TABS.some(function (t) { return t.id === initial; })) { try { initial = localStorage.getItem("tl-tab") || "overview"; } catch (e) { initial = "overview"; } }
  state.tab = TABS.some(function (t) { return t.id === initial; }) ? initial : "overview";
  render();
  window.addEventListener("hashchange", function () {
    var id = (location.hash || "").replace("#", "");
    if (id !== state.tab && TABS.some(function (t) { return t.id === id; })) selectTab(id, false);
  });
  setInterval(renderClocks, 30000);
  connect();
})();
</script>
