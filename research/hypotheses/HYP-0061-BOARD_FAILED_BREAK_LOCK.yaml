id: HYP-0061
trial: "BOARD-FAILED-BREAK-LOCK"
family: O                       # the options desk's entry rules and the filters tried on them (DEC-0028, DEC-0041); total 38 with this one
status: pre-registered          # DEC-0053 (accepted 2026-11-17); NOT blind: one owner trade on a re-armed side was seen first (DEC-0053, "What has already been seen")
arm: replay                     # the board's break-and-retest ENTERs with and without the lock, replayed on sessions already recorded: no order of any kind
statement: "On the replayed sessions of EXP-0036 (EXP-0035's list extended to the last session before the release that ships DEC-0053 section 1; focus names only; SIP 2-minute bars; the session of the owner trade DEC-0052 names, which DEC-0053 names too, left out), among the board's break-and-retest ENTERs under DEC-0052 section 1, those DEC-0053 section 1 removes reach the card's target 1 before the card's stop in a smaller share than those it keeps. An ENTER is one (session, focus name, side, brokeAt) whose row (stateRows, so the 09:35 start, the lunch block and the flat time apply) first reads enter_zone for a break and retest without the lock. It is kept if the row also reads enter_zone for that key with the lock; removed by the lock if at that slot the side reads plan_off with a failure time, or watch with a failure time after an ended lock on a break made inside it; removed as unseen if it reads GET READY with lockUnseen (counted apart, not tested); any other removal, or an ENTER only with the lock, is a fault, counted and reported. It is scored once, from the open of the first 2-minute bar starting at or after that slot's evaluation time, on the stock, with the card's entry, stop and target 1 frozen under DEC-0035 (ENTRY_ATR 0.01, STOP_ATR 0.1, MIN_ROOM_MULTIPLE 2), first touch wins, a bar touching both counts as the stop; neither by 15:10 New York (12:10 on a half day) is 'neither'."
rule: kept_minus_removed        # a = ENTERs the lock keeps; b = ENTERs the lock removes; both from the board without the lock (DEC-0052's engine)
frozen: {unit: enter, enter_key: [session, symbol, side, brokeAt], groups: {a: kept_by_lock, b: removed_by_lock}, outcome: {target: card_t1, stop: card_stop, first_touch_wins: true, both_in_one_bar: stop, flat: "15:10 (12:10 half day)"}, measure: share_reaching_t1_first, counts: [enters, t1_first, stop_first, neither, removed_unseen, faults], bars: sip_2min, names: focus_only, excluded_sessions: ["the session of the owner trade named in DEC-0052 and DEC-0053, one session (its date is in the owner's PRIVATE notes, not here)"], resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261161, interval: [2.5, 97.5], percentile: numpy_linear, too_few: {removed_enters: 10, kept_enters: 20, sessions_on_the_list: 10}}
session_list: "amended by DEC-0065 (accepted 2026-11-19), before the run: every session with a DEC-0044 server record from 2026-11-12 through 2027-01-29, the owner-trade session excluded; this replaces the session list the statement and `since` name; nothing else changes"
config: research/experiments/EXP-0036-board-failed-break-lock-replay/config.yaml
evidence: {decision: DEC-0053, experiments: [EXP-0036-board-failed-break-lock-replay]}
since: "replay of sessions already recorded: EXP-0035's session list, extended to the last session before the release that ships DEC-0053 section 1; the session list is written into EXP-0036 README.md before the replay is run, and the replay is run once"
close_without_verdict: "if the board's pull request for DEC-0053 is not merged by 2027-02-28, or the replay cannot be run on both engines from the recorded inputs"
falsified_if: "Read once. With at least 10 removed ENTERs, 20 kept ENTERs and 10 sessions on the list: the lower end of the 95% bootstrap range of (share reaching target 1 first among kept) minus (the same among removed), resampling sessions with replacement (5,000 resamples, mulberry32 seeded 20261161, numpy linear percentiles), is at or below 0. Fewer is too few to judge: an exploratory mark, not proof. Not blind (see status): the report says so beside the verdict. The verdict does not withdraw DEC-0053 section 1 by itself: only when the whole 95% range of (removed minus kept) lies above 0 is the owner told, and the owner decides whether to write a further record."
