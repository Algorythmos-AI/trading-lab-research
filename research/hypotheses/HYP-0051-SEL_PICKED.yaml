id: HYP-0051
trial: "SEL-PICKED"
family: F                       # the two-stage selection's accuracy (DEC-0047); counted apart from the global, C, O and M families
status: pre-registered          # DEC-0047 (proposed 2026-11-12, revised blind the same day); registered before any session of the selection exists
arm: selection                  # a comparison of the selection's names by the ledger's stock outcome: no order of any kind
statement: "On counted sessions from the switch (DEC-0047 section 1), the names the two-stage selection picks (DEC-0046 Stage 1, the first min(4, eligible) eligible names by final rank, those that are scored) have a higher mean R per triggered side than the Stage 1-eligible scored names of the same session that were not picked. The unit is every data-valid name with published card fields; names not data-valid, with internal_error, without card fields, with a split ex-date on the session, with unusable bars, with no level or with a card fault are counted, not scored; ineligible and unranked scored names are descriptive only. A name's outcome is the ledger's own rule at focus-card-ledger commit 8130c7c460ffa08cb2d54af49d1c05ab89c215b3 (card.derive_levels, score.score, scorer 1.1, exit policy card: entry = level +/- 0.01 ATR, stop = level -/+ 0.1 ATR, T1 = entry +/- 2R; trigger = the first 2-minute close strictly beyond the level; fill = a later bar touching the entry and closing at or beyond the level, outside 09:30-09:35 and 11:30-13:00 New York, a close through the stop first killing it; then target 1 on a high or low reaching T1, the stop on a later close through it, the stop assumed first when one bar does both, else the last bar's close; R = round(sg x (exit - entry) / |entry - stop|, 2)), for the side whose trigger comes first, on Alpaca SIP 1-minute bars (feed=sip, adjustment=raw, starting at or after 09:30 and before 16:00) fetched at least 30 minutes after the close and joined into 2-minute bars. A name with no trigger has no R; a name whose first-triggering side does not fill scores R = 0 (no trade was made)."
rule: picked_minus_rest_per_session
frozen: {statistic: "mean over included sessions of D_s = mean R per triggered side (picked) - mean R per triggered side (rest)", rest: stage1_eligible_scored_not_picked, triggered_no_entry_r: 0, session_weight: equal, excluded_session: either group without a triggered name (counted), resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261147, interval: [2.5, 97.5], percentile: numpy_linear, halves: "included sessions in date order, the first floor(n/2) then the rest", min_counted_sessions: 60, min_included_sessions: 30, level: one-sided 2.5%, holm: false, also_reported: [point_estimate_and_range, trigger_rate_by_group, entry_rate_by_group, exclusion_counts], ledger_commit: 8130c7c460ffa08cb2d54af49d1c05ab89c215b3, policy: card, side: first_trigger}
config: research/experiments/EXP-0032-selection-forward/config.yaml
evidence: {decision: DEC-0047, experiments: [EXP-0032-selection-forward]}
since: "the first regular New York session on which the edition's focus names are the Stage 1 picks under DEC-0048's switch (precondition 4), once preconditions 1 to 3 of DEC-0047 section 10 are met (the ledger change, the card fields of every data-valid name, the frozen analysis code); forward only, never backfilled. A session counts only as DEC-0047 section 1 says. Ends early at the last session before any of these reaches production: a dated amendment to DEC-0046 that changes the selection, a change to the universe, a change to the card-field code, an amendment to DEC-0035 that changes a card number, a change to the frozen outcome rule, or a change to the analysis code other than a defect fix DEC-0047 section 10 allows. Every early end closes the experiment with no verdict, and a breach of the blind rule (DEC-0047 section 8) makes it unreadable; either counts as inconclusive for DEC-0047 section 9"
close_without_verdict: "2027-09-30"
falsified_if: "Read once, at the first of the 120th counted session or the end of the session of 2027-09-30. With at least 60 counted and 30 included sessions: the 2.5th percentile of the 5,000 session-bootstrap means of D_s (mulberry32, seed 20261147, numpy linear percentiles) is at or below 0, or the mean of D_s is at or below 0 in either half of the included sessions taken in date order (the first floor(n/2), then the rest). Fewer than 60 counted or 30 included sessions closes it inconclusive. Falsified means only that the registered condition was not met; the point estimate and range are reported beside it. Not supported (falsified or inconclusive, an early end or an unreadable experiment included), Stage 1's scoring is replaced by HYP-0053's fixed rule by a dated decision (DEC-0047 section 9)."
