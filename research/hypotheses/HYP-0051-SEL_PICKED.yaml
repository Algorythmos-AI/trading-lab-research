id: HYP-0051
trial: "SEL-PICKED"
family: F                       # the two-stage selection's accuracy (DEC-0047); counted apart from the global, C, O and M families
status: pre-registered          # DEC-0047 (proposed 2026-11-12); registered before any session of the selection exists
arm: selection                  # a comparison of the selection's names by the ledger's stock outcome: no order of any kind
statement: "On counted sessions from the switch (DEC-0047 section 1), the names the two-stage selection picks (DEC-0046 Stage 1, the first min(4, eligible) eligible names by final rank) have a higher mean R per entered side than the other scored names of the same session. The unit is every data-valid name with published card fields; names not data-valid, with internal_error, without card fields, with a split ex-date on the session, with unusable bars, with no level or with a card fault are counted, not scored. A name's outcome is the ledger's own rule at focus-card-ledger commit 8130c7c460ffa08cb2d54af49d1c05ab89c215b3 (card.derive_levels, score.score, scorer 1.1, exit policy card: entry = level +/- 0.01 ATR, stop = level -/+ 0.1 ATR, T1 = entry +/- 2R; trigger = the first 2-minute close strictly beyond the level; fill = a later bar touching the entry and closing at or beyond the level, outside 09:30-09:35 and 11:30-13:00 New York, a close through the stop first killing it; then target 1 on a high or low reaching T1, the stop on a later close through it, the stop assumed first when one bar does both, else the last bar's close; R = round(sg x (exit - entry) / |entry - stop|, 2)), for the side whose trigger comes first, on Alpaca SIP 1-minute bars (feed=sip, adjustment=raw, 09:30 to 16:00) fetched at least 30 minutes after the close and joined into 2-minute bars. A name with no trigger, or whose first-triggering side does not fill, has no R. The rest includes ineligible and unranked data-valid names."
rule: picked_minus_rest_per_session
frozen: {statistic: "mean over included sessions of D_s = mean R(picked names with R) - mean R(rest with R)", session_weight: equal, excluded_session: either group without R (counted), resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261147, interval: [2.5, 97.5], percentile: numpy_linear, halves: "included sessions in date order, split at floor(n/2)", min_counted_sessions: 60, min_included_sessions: 30, level: one-sided 2.5%, holm: false, also_reported: [trigger_rate_by_group, entry_rate_by_group, exclusion_counts], ledger_commit: 8130c7c460ffa08cb2d54af49d1c05ab89c215b3, policy: card, side: first_trigger}
config: research/experiments/EXP-0032-selection-forward/config.yaml
evidence: {decision: DEC-0047, experiments: [EXP-0032-selection-forward]}
since: "the first regular New York session on which the edition's focus names are the Stage 1 picks under DEC-0048's switch, once the ledger change of DEC-0047 section 10 is merged (precondition 1); forward only, never backfilled. A session counts only as DEC-0047 section 1 says. Ends early, and is read then under the same rules, at the last session before a dated amendment to DEC-0046 that changes the selection, an amendment to DEC-0035 that changes a card number, or a change to the frozen outcome rule reaches production; a breach of the blind rule (DEC-0047 section 8) ends it as unreadable"
close_without_verdict: "2027-09-30"
falsified_if: "Read once, at the first of the 120th counted session or the end of the session of 2027-09-30. With at least 60 counted and 30 included sessions: the 2.5th percentile of the 5,000 session-bootstrap means of D_s (mulberry32, seed 20261147, numpy linear percentiles) is at or below 0, or the mean of D_s is at or below 0 in either half of the included sessions taken in date order (split at floor(n/2)). Fewer than 60 counted or 30 included sessions closes it inconclusive. Falsified or inconclusive, Stage 1's scoring is replaced by HYP-0053's fixed rule by a dated decision (DEC-0047 section 9)."
