id: HYP-0066
trial: "RADAR-DAILY-5D"
family: R                       # the pre-market Radar's selection, forward (DEC-0055); counted apart from the global, C, O, M and F families
status: pre-registered          # DEC-0055 (proposed 2026-11-17); NOT blind: the Radar's own scorecards were seen first (DEC-0055, "What has already been seen")
arm: radar                      # the Radar's listed names against a fixed fund, from the open: no order of any kind
statement: "On counted sessions S of EXP-0038 (DEC-0055 section 1), the distinct names on the scored radar edition's first 'DAILY RADAR' list, after the frozen desk names, GOOG, the symbols the day's sealed Nasdaq Trader directory marks ETF and the symbols it does not list are taken out (DEC-0055 section 2), return more than RSP over the open of S to the close of S+4 (c(S+4) / o(S) - 1), S+4 the fourth regular session after S; a name without a later bar keeps its last close, by Alpaca SIP daily bars as served (feed=sip, adjustment=all); only a spin-off in the window takes a name out. A session is included in this trial when it has that list, at least one scored name and RSP's bar on S. Per included session D_S = the mean of the scored names' returns minus RSP's return over the same window."
rule: list_minus_fund_per_session
frozen: {statistic: "mean over included sessions of D_S", list: "DAILY RADAR", taken_out: [desk_name, desk_added, desk_proxy, exchange_traded_product, unknown_symbol], benchmark: RSP, bars: {source: alpaca, timeframe: 1Day, feed: sip, adjustment: all}, resamples: 5000, resample: "circular blocks of 5 consecutive counted sessions, included sessions kept in the order drawn until n, the last block cut there", prng: mulberry32, seed: 20261156, interval: [2.5, 97.5], percentile: numpy_linear, halves: "included sessions in date order, the first floor(n/2) then the rest", min_analysed_sessions: 60, min_included_sessions: 40, level: one-sided 2.5%, holm: [HYP-0066, HYP-0067], role: secondary}
config: research/experiments/EXP-0038-radar-forward/config.yaml
evidence: {decision: DEC-0055, experiments: [EXP-0038-radar-forward]}
since: "the first regular New York session after the date on which the last of DEC-0055 section 8's preconditions is written in EXP-0038's README (the evidence repository private, the radar seal step live with the skill bundle's hash, the dashboard's radar edition copies, the data branch protected, the analysis code frozen, DEC-0055 accepted, among them the symbol directory and the daily receipt listing); forward only, never backfilled; lapses with no session counted if they are not all met by 2027-02-28. A session counts only as DEC-0055 section 1 says: the earliest radar edition copy for S in the sealed daily receipt listing (data/radar-receipts/S.json, sealed by the after-close routine and matched at the read against the dashboard's never-deleted copies) received after the previous session's close and before 09:30 New York on S, and the day's sealed symbol directory readable; such counted sessions alone set the read date and the early end, and two checks at the read (the store matching the listing, the edition's content available) only take sessions out of the analysis. Ends early, with no verdict, at the last session before a change to the frozen analysis code other than a defect fix with a test that fails before it and that changes no count already shown, or after 10 consecutive regular sessions not counted."
close_without_verdict: "2027-06-30"   # the last session that can count; the read follows four sessions later
falsified_if: "Read once, after the close of the fourth regular session after the last session that can count (the 120th counted session, or 2027-06-30 if fewer are counted by then). With at least 60 analysed and 40 included sessions: the Holm-adjusted one-sided p-value (bootstrap means at or below 0, plus 1, over 5,001; Holm over HYP-0066 and HYP-0067, an inconclusive trial's p taken as 1) is above 0.025, or the mean of D_S is at or below 0 in either half of the included sessions. Fewer sessions closes it inconclusive. Falsified means only that the registered condition was not met; the point estimate and range are reported beside it."
