id: HYP-0046
trial: "OC-TRAP"
family: O                       # options desk (DEC-0028); counted in family O (DEC-0041)
status: pre-registered          # DEC-0041; registered before any shadow result exists
arm: shadow                     # virtual trades from wt.options.shadow on the runner's own tape: no order
statement: "Buying one same-day or nearest-expiry call or put on a failed break (pop and fade) at a strong level, in the direction of the name's and SPY's VWAP, has positive return on premium after fees. A failed break at a strong level, completed by the last 2-minute bar. For a put at level L: bar A closes above L with the close before it at or below L (the break of OC-RETEST); within the 3 bars after A, the last bar is the first to close below L. The entry is that close; the invalidation is a 2-minute close above the highest high from A to the last bar. A call is the mirror at support. Strong levels only, as OC-REJECT (levels.strong and the big zones), within tolerance_atr of the close. Virtual only, never an order: the entry is filled at the ask of the first quote after the signal of the contract wt.options.chain.pick chooses, if that ask is within the clone's entry limit (the signal-time ask plus 2%, never above max_ask) before the end of the next 2-minute bar, and otherwise is counted unfilled. Every gate of setups.gate, the event blocks, the contract filters, the day's entry window (10:00 to 14:30) and at most 5 entries a day apply; one virtual position per arm at a time; the account's latches and max_open_positions do not, as nothing reaches the account. Exits are the control's (25% premium stop, breakeven after +25%, 50% target, 5-minute time stop, the next level, the invalidation close, 15:10), priced at the bid, after $0.03 a contract each way."
rule: trap                  # a new setup in wt.options.setups beside retest and rejection, read only by wt.options.shadow
frozen: {levels: strong_only, break: close_across_with_prior_close_not_across, fail_within_bars: 3, entry: first_close_back_inside, invalidation: close_beyond_extreme_since_break}
config: config/options_clone.yaml
evidence: {decision: DEC-0041, experiments: [EXP-0030-options-clone-research-arms]}
since: "the first session of job paper-o that runs a release containing wt.options.shadow (research_arms on); never backfilled. Ends early, with whatever it has, on the last session under EXP-0029's frozen config if that config changes"
close_without_verdict: "2027-11-05"
falsified_if: "With at least 30 trades (filled, virtual) and 20 sessions: the lower end of the 95% bootstrap range of mean return on premium after fees, resampled by session, is at or below 0, or the mean is at or below 0 in either half of the trades taken in order. Fewer than 30 trades by 2027-11-05 closes the trial with no verdict. A pass places no order: trading the setup needs its own record and new trials."
