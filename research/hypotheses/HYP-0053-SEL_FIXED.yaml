id: HYP-0053
trial: "SEL-FIXED"
family: F                       # the two-stage selection's accuracy (DEC-0047); counted apart from the global, C, O and M families
status: pre-registered          # DEC-0047 (proposed 2026-11-12, revised blind the same day); registered before any session of the selection exists
arm: selection                  # a comparison of the selection's names by the ledger's stock outcome: no order of any kind
statement: "On counted sessions, the picked names have a higher mean R per triggered side than a fixed rule's names, chosen before the open from the Stage 1-eligible names: SPY and QQQ, each when Stage 1-eligible, plus the two single names of the other ten with the highest Stage 1 ATR% (ATR14 / close, rounded to 6 decimals) among the Stage 1-eligible ones, ties by symbol A to Z; a member that cannot be scored is missing and not replaced, and a name in both sets counts in both. Unit, outcome, side and bars as HYP-0051; R per triggered side, as HYP-0051 (DEC-0047 section 3): an entered name's card-policy R, 0 for a triggered name without an entry, no R for a name with no trigger. D_s = mean R per triggered side of the picked names minus the same for the fixed set; a session where either has no triggered name is excluded and counted. Co-primary for the pre-set action only (DEC-0047 section 9): tested on its own, not Holm-adjusted."
rule: picked_minus_fixed_rule_per_session
frozen: {fixed_set: [SPY, QQQ, top_2_atr_pct_single_names], chosen_from: "Stage 1-eligible names, before the open", atr_pct: "ATR14 / close, rounded to 6 decimals, from the Stage 1 output", ties: symbol_a_to_z, missing: not_replaced, overlap: counts_in_both, triggered_no_entry_r: 0, statistic: "mean over included sessions of D_s", resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261147, p_one_sided: "(1 + #{resampled mean <= 0}) / 5001", level: one-sided 2.5%, holm: false, role: co_primary_for_action, halves: "included sessions in date order, the first floor(n/2) then the rest", min_counted_sessions: 60, min_included_sessions: 30}
config: research/experiments/EXP-0032-selection-forward/config.yaml
evidence: {decision: DEC-0047, experiments: [EXP-0032-selection-forward]}
since: "the first regular New York session on which the edition's focus names are the Stage 1 picks under DEC-0048's switch (precondition 4), once preconditions 1 to 3 of DEC-0047 section 10 are met (the ledger change, the card fields of every data-valid name, the frozen analysis code); forward only, never backfilled. A session counts only as DEC-0047 section 1 says. Ends early at the last session before any of these reaches production: a dated amendment to DEC-0046 that changes the selection, a change to the universe, a change to the card-field code, an amendment to DEC-0035 that changes a card number, a change to the frozen outcome rule, or a change to the analysis code other than a defect fix DEC-0047 section 10 allows. Every early end closes the experiment with no verdict, and a breach of the blind rule (DEC-0047 section 8) makes it unreadable; either counts as inconclusive for DEC-0047 section 9"
close_without_verdict: "2027-09-30"
falsified_if: "Read once, with HYP-0051. With at least 60 counted and 30 included sessions: the one-sided p, unadjusted, is above 0.025, or the mean of D_s is at or below 0 in either half of the included sessions in date order (the first floor(n/2), then the rest). Below the minimums, inconclusive. Falsified means only that the registered condition was not met; the point estimate and range are reported beside it. Not supported (falsified or inconclusive, an early end or an unreadable experiment included), Stage 1's scoring is replaced by this fixed rule by a dated decision (DEC-0047 section 9); that is the choice of the simpler rule, not a finding that the fixed rule is better."
