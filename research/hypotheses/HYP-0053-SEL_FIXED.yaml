statement: "On counted sessions, the picked names have a higher mean R per entered side than a fixed rule's names: SPY and QQQ, each when scored and Stage 1-eligible, plus the two single names of the other ten with the highest Stage 1 ATR% (ATR14 / close, rounded to 6 decimals) among those scored and Stage 1-eligible, ties by symbol A to Z; a name missing from the fixed set is not replaced, and a name in both sets counts in both. Unit, outcome, side and bars as HYP-0051. D_s = mean R of the picked names with R minus mean R of the fixed set's names with R; a session where either has no R is excluded and counted."
