id: HYP-0057
trial: "OWN-CAUTION-SIP"
family: M                       # the owner's own trades (DEC-0045); counted apart from the global, C and O families
status: pre-registered          # DEC-0050; registered before any label exists, on any feed
arm: label                      # a split of the owner's own positions by the board's end-of-day replay: no order of any kind
statement: "Among the owner's on-plan positions (in_zone or early, as HYP-0056 defines them, with the cautions stored on the label row of the position's first fill), those opened with no DEC-0042 caution and no unknown check on their side at t0 have a higher mean R25 net of fees than those opened with at least one caution. The cautions are all the ones entryChecks (dashboard/src/lib/entry-checks.ts, in the frozen copy of DEC-0045) returns for entryChecks(input, kind) at now = t0, with the inputs the replay builds only from bars ended by t0, not only the two the desk shows: range (middle of range), gap (gap not filled), leader (SMH against, QQQ only), iv (implied volatility above the cap), late (the 2-minute bar forming at t0 ends from 11:00 to 14:30 New York, full days only), winner (a journal piece of any kind closed earlier that day before t0 with pnl > 0, before fees). The desk-only early caution of DEC-0043 (before10) is not a caution for this test. A position with no caution but at least one check the replay could not run (entryChecks' unknown) is in neither group and is counted."
rule: no_caution_vs_caution  # groups: clean = no caution and no unknown check; cautioned = at least one caution
frozen: {among: [in_zone, early], cautions: [range, gap, leader, iv, late, winner], not_a_caution: [before10], all_returned_count: true, late: ['11:00', '14:30'], groups: {a: no_caution_no_unknown, b: at_least_one_caution}, difference: a_minus_b, excluded: no_caution_with_unknown, max_per_group: 150, measure: R25_net, also_reported: [R50_net, R25_gross, R50_gross], fees: {open: 0.55, close: 0.56, expired_close: 0}}
config: research/experiments/EXP-0033-owner-trades-board-sip/config.yaml
evidence: {decision: DEC-0050, experiments: [EXP-0033-owner-trades-board-sip]}
since: "the first New York session after the release that first writes EXP-0033's labels reaches production, which waits for the cutover note of DEC-0050 point 1 (a frozen copy of the engine whose version is DEC-0045's content hash of its five files in that release, and a frozen calendar; labels written once per buy fill from SIP bars asked for by name, never through ALPACA_FEED, never worked out again; no one runs the labeller on the owner's journal before that release); never backfilled. A position whose t0 has neither a sip stamp in the 2 minutes before it nor two consecutive sip stamps either side of it (feed_unknown) or that follows a 10-minute run without a SIP answer (board_off) is no_record and counted. Every early end closes the trial inconclusive with no verdict, whatever the counts: an amendment to DEC-0035, a change to the value of a rule limit in dashboard/src/lib/trade-rules.ts (a rename or moved code is not one), a change to the journal importer's matching, a journal with fees_included true, any stamp after the start reading other than sip, a stamp gap over 10 minutes with a deployment change across it, a broken stamp chain or missing manifest, a change to the frozen engine copy or a past session's calendar entry, or a session's bars fetch still failing 5 sessions later (EXP-0033 config.yaml)"
close_without_verdict: "2027-11-12"
falsified_if: "Read once, at the first of: both groups at 150 positions or 2027-11-12 (an early end gives no verdict). With at least 30 positions in each group and 20 sessions: the lower end of the 95% bootstrap range of the difference in mean R25 net of fees, no caution minus at least one, resampled by session (5,000 resamples, the seed, generator and percentiles of EXP-0033), is at or below 0, or that difference is at or below 0 in either half of the positions taken in order of t0 (both groups pooled, split at floor(n/2); a half with an empty group fails). Groups take their first 150 positions by t0. Sessions are the distinct New York days of t0 of the positions in either group. Fewer than 30 positions in either group or fewer than 20 sessions at that point closes the trial inconclusive. A pass changes nothing on the desk: no caution becomes a rule without its own record."
