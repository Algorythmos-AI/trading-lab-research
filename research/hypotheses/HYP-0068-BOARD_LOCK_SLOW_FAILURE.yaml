id: HYP-0068
trial: "BOARD-LOCK-SLOW-FAILURE"
family: O                       # the options desk's entry rules and the filters tried on them (DEC-0028, DEC-0041); total 48 with this one
status: pre-registered          # DEC-0065 (proposed 2026-11-19); NOT blind: the group sizes on the five logged sessions were counted first, with no outcome (DEC-0065, "What has already been seen")
arm: replay                     # a secondary split of EXP-0036's removed ENTERs: no order of any kind
statement: "On EXP-0036's replayed sessions (every session with a DEC-0044 server record from 2026-11-12 through 2027-01-29, focus names only, SIP 2-minute bars, the owner-trade session excluded as EXP-0036 already says), among the ENTERs EXP-0036 counts as removed by the lock, those whose removing lock was set by a slow failure reach the card's target 1 before the card's stop in a share no greater than the share among the ENTERs the lock keeps. A removed ENTER's lock is the side's failedAt at that slot; its break is the brokeAt the side carried while it read plan_off with that failedAt; the failure is fast when failedAt minus brokeAt is at most FAIL_WITHIN_BARS (3) two-minute bars, else slow. Outcomes, entry, card, first touch and the flat time are EXP-0036's, unchanged."
rule: slow_removed_minus_kept   # a = ENTERs removed by a lock a slow failure set; b = ENTERs the lock keeps; both from the board without the lock (DEC-0052's engine)
frozen: {unit: enter, enter_key: [session, symbol, side, brokeAt], groups: {a: removed_by_lock_slow_failure, b: kept_by_lock}, slow: "failedAt - brokeAt > FAIL_WITHIN_BARS x 2 min (FAIL_WITHIN_BARS = 3, trade-state.ts)", reported_not_tested: "removed ENTERs by the failing bar's half: ends by 13:00, or after", outcome: "EXP-0036's", measure: share_reaching_t1_first, resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261168, interval: [2.5, 97.5], percentile: numpy_linear, too_few: {slow_removed_enters: 10, kept_enters: 20, sessions_on_the_list: 10}}
config: research/experiments/EXP-0036-board-failed-break-lock-replay/config.yaml
evidence: {decision: DEC-0065, experiments: [EXP-0036-board-failed-break-lock-replay]}
since: "replay of sessions already recorded, on the fixed list DEC-0065 section 1 sets; run once with EXP-0036, after the 2027-01-29 session is sealed"
close_without_verdict: "with EXP-0036: if the board's pull request for DEC-0053 is not merged by 2027-02-28 (it was, in #468), or the replay cannot be run on both engines from the recorded inputs, or it is not run by 2027-02-28"
falsified_if: "Read once. With at least 10 slow-removed ENTERs, 20 kept ENTERs and 10 sessions on the list: the whole 95% bootstrap range of (share reaching target 1 first among slow-removed) minus (the same among kept), resampling sessions with replacement (5,000 resamples, mulberry32 seeded 20261168, numpy linear percentiles), lies above 0. Fewer is too few to judge: an exploratory mark, not proof. Not blind (see status): the report says so beside the verdict. A falsification changes nothing by itself: the owner is told, and may propose by a new record that only a failure within FAIL_WITHIN_BARS bars locks its side. Secondary to HYP-0061 and on a subset of its removed group: not independent of it."
