id: HYP-0063
trial: "CLONE-RETEST-FREE-CONFIRM"
family: O                       # the options desk's entry rules and the filters tried on them; total 41 with HYP-0062 to HYP-0064 (DEC-0054)
status: proposed                # DEC-0054 (PROPOSED 2026-11-17); pre-registered once the owner accepts it. Blind: EXP-0037 replays only sessions after acceptance (DEC-0054, "What has already been seen")
arm: replay                     # the clone's dry run (DEC-0031) on the control and this variant: no order of any kind
statement: "On the sessions of EXP-0037 (every session after DEC-0054 is accepted, until 40 sessions or 2027-04-30; SPY and QQQ; DEC-0031's bars, contracts, prices, fees and management under EXP-0029's config), the trades this variant adds to the frozen clone have a positive mean return on premium after the spread and fees. The variant: When the first close beyond the touch bar's close (the bar setups.retest completes on) comes while the clone cannot enter for a passing reason (a position open, the loss pause after two losses in a row, or the 20-minute cooldown on that name), the retest may instead complete on the first later bar that closes beyond the touch bar's close, if all of these hold: the clone can enter then; no close since the break has been at or back through the level; the bar is within max_bars_to_retest bars of the first confirmation. The entry is that bar's close and the invalidation is the control's. A confirmation lost to a lasting block (the day's or the name's entry count, the latch, done after three losses, the entry window, an event block, KILL) is not carried. Every other rule, gate and number is the control's. A trade is added when the variant takes it and the control does not, matched by (session, name, setup, side, signal bar); a retest whose first confirmation comes when the clone is free is read exactly as by the control."
rule: added_mean_rop            # the mean return on premium of the trades the variant adds, against 0; the variant's total against the control's as a guard
frozen: {unit: trade, match_key: [session, root, setup, side, signal_bar], groups: {added: variant_only, displaced: control_only}, measure: return_on_premium, spreads: [1x, 2x], names: [SPY, QQQ], engine: wt.options.dryrun, control_config: config/options_clone.yaml at EXP-0029, resamples: 5000, resample_unit: session, prng: numpy_pcg64, seed: 20261163, interval: [0.8333, 99.1667], percentile: numpy_linear, too_few: {added_trades: 30, sessions_with_added: 15}}
config: research/experiments/EXP-0037-clone-loophole-replay/config.yaml
evidence: {decision: DEC-0054, experiments: [EXP-0037-clone-loophole-replay]}
since: "the first session after DEC-0054 is accepted; the list is fixed by rule (every exchange session after acceptance, the first 40, none after 2027-04-30); each session's inputs are fetched and hashed by the exp0037 host job the evening it closes, before any replay; the replay is run once, by that job, the evening the list closes"
close_without_verdict: "if DEC-0054 is not accepted by 2027-01-31, or EXP-0037's replay code is not merged before the last session on its list"
falsified_if: "Read once. With at least 30 added trades in at least 15 sessions: falsified unless the lower end of the 98.33% bootstrap range (Bonferroni over HYP-0062 to HYP-0064) of the added trades' mean return on premium at 1x the spread, resampling sessions with replacement (5,000 resamples, numpy PCG64 seeded 20261163, numpy linear percentiles), is above 0, the added trades' mean at 2x the spread is above 0, and the variant's total return over all its trades at 1x is not below the control's. Fewer is too few to judge: an exploratory mark, not proof. A supported verdict changes nothing by itself: a further record may freeze the variant for a new paper experiment with new trials."
