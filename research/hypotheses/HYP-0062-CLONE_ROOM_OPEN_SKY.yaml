id: HYP-0062
trial: "CLONE-ROOM-OPEN-SKY"
family: O                       # the options desk's entry rules and the filters tried on them; total 41 with HYP-0062 to HYP-0064 (DEC-0054)
status: proposed                # DEC-0054 (PROPOSED 2026-11-17); pre-registered once the owner accepts it. Blind: EXP-0037 replays only sessions after acceptance (DEC-0054, "What has already been seen")
arm: replay                     # the clone's dry run (DEC-0031) on the control and this variant: no order of any kind
statement: "On the sessions of EXP-0037 (every session after DEC-0054 is accepted, until 40 sessions or 2027-04-30; SPY and QQQ; DEC-0031's bars, contracts, prices, fees and management under EXP-0029's config), the trades this variant adds to the frozen clone have a positive mean return on premium after the spread and fees. The variant: When no mark lies beyond a signal's entry on its side (setups.next_level is None), the room and reach gates read a measured level instead of failing: the level at entry + s x min_room_multiple x risk (s = +1 for a call, -1 for a put; risk = |entry - invalidation|; min_room_multiple from config/options_clone.yaml). Room passes, and reach passes when that distance is within the remaining move, as reach does today. The next-level exit (DEC-0031 section 3, rule 6) uses the same measured level. Every other rule, gate and number is the control's. A trade is added when the variant takes it and the control does not, matched by (session, name, setup, side, signal bar); a signal with a mark beyond its entry is read exactly as by the control."
rule: added_mean_rop            # the mean return on premium of the trades the variant adds, against 0; the variant's total against the control's as a guard
frozen: {unit: trade, match_key: [session, root, setup, side, signal_bar], groups: {added: variant_only, displaced: control_only}, measure: return_on_premium, spreads: [1x, 2x], names: [SPY, QQQ], engine: wt.options.dryrun, control_config: config/options_clone.yaml at EXP-0029, resamples: 5000, resample_unit: session, prng: numpy_pcg64, seed: 20261162, interval: [0.8333, 99.1667], percentile: numpy_linear, too_few: {added_trades: 30, sessions_with_added: 15}}
config: research/experiments/EXP-0037-clone-loophole-replay/config.yaml
evidence: {decision: DEC-0054, experiments: [EXP-0037-clone-loophole-replay]}
since: "the first session after DEC-0054 is accepted; each session is written into EXP-0037 README.md as it passes, before any replay; the replay is run once, after the last session on the list"
close_without_verdict: "if DEC-0054 is not accepted by 2027-01-31, or EXP-0037's replay code is not merged before the last session on its list"
falsified_if: "Read once. With at least 30 added trades in at least 15 sessions: falsified unless the lower end of the 98.33% bootstrap range (Bonferroni over HYP-0062 to HYP-0064) of the added trades' mean return on premium at 1x the spread, resampling sessions with replacement (5,000 resamples, numpy PCG64 seeded 20261162, numpy linear percentiles), is above 0, the added trades' mean at 2x the spread is above 0, and the variant's total return over all its trades at 1x is not below the control's. Fewer is too few to judge: an exploratory mark, not proof. A supported verdict changes nothing by itself: a further record may freeze the variant for a new paper experiment with new trials."
