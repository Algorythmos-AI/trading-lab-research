id: HYP-0048
trial: "OWN-ONPLAN"
family: M                       # the owner's own trades (DEC-0045); counted apart from the global, C and O families
status: pre-registered          # DEC-0045; registered before any label exists
arm: label                      # a split of the owner's own positions by the board's end-of-day replay: no order of any kind
statement: "The owner's long single-leg option positions opened while the board showed their side on plan (in_zone or early) have a higher mean R25 net of fees than those opened off plan (off_plan). A position is the long call or put pieces of one contract (symbol, kind, strike, expiry) opened on one New York day: pieces sorted by opened_at join the current group while their opened_at is strictly before the group's latest closed_at so far, and a piece opened at or after it starts a new position; stock and short pieces are left out, and a position with an open lot, cost 0 or a piece listed in the journal's gaps is left out and counted. R25 = (journal pnl - fees) / (0.25 x premium cost), fees $0.55 a contract opened and $0.56 a contract closed (none on a piece left to expire), the journal's fees_included being false or null. Labels come from the end-of-day replay of the session's stored edition and settled 2-minute IEX bars through a frozen copy of the desk's engine (DEC-0045 section 3): nameState evaluated once per 2-minute bar at the bar's end + 5 s, from inputs built only from bars ended by then, a side's state being its nameState side state while the row is neither no_trade nor paused, over half-open intervals. At t0 = the position's first opened_at, on the position's own side, the label is the first that applies of: no_record (edition missing, bars incomplete from 09:30 to t0, or the side carries gap or brokeEarlier), not_focus, in_zone (t0 in an enter_zone interval extended by 60 s at its end), early (t0 in a get_ready interval), alt (an alternative trigger with alt.side equal to the position's kind was live), off_plan. alt, not_focus and no_record positions are in neither group and are counted."
rule: on_plan_vs_off_plan   # groups: on_plan = {in_zone, early}; off_plan = {off_plan}
frozen: {groups: {a: [in_zone, early], b: [off_plan]}, difference: a_minus_b, excluded: [alt, not_focus, no_record], label_order: [no_record, not_focus, in_zone, early, alt, off_plan], measure: R25_net, also_reported: [R50_net, R25_gross, R50_gross], zone_extend_s: 60, state_valid_from: bar_end_plus_CLOSE_GRACE_MS, intervals: half_open, max_per_group: 150, fees: {open: 0.55, close: 0.56, expired_close: 0}}
config: research/experiments/EXP-0031-owner-trades-board/config.yaml
evidence: {decision: DEC-0045, experiments: [EXP-0031-owner-trades-board]}
since: "the first New York session after the release that first writes labels reaches production (DEC-0045, a frozen copy of the engine whose ENGINE_VERSION is the content hash of its files in that release; labels written once per session from IEX bars asked for by name (DEC-0049), never worked out again; no one runs the labeller on the owner's journal before that release); never backfilled. Sessions replayed under another ENGINE_VERSION are left out and counted. Ends early, with whatever it has, on an amendment to DEC-0035, a change to the value of a rule limit in dashboard/src/lib/trade-rules.ts (a rename or moved code is not one), a change to the journal importer's matching, a journal with fees_included true or the production ALPACA_FEED resolving to sip (DEC-0049: then the trial closes inconclusive with no verdict, whatever the counts, and with no session if before the release that first writes labels); the last session counted is then the last full session before the change reaches production"
close_without_verdict: "2027-11-11"
falsified_if: "Read once, at the first of: both groups at 150 positions, the window ending, or 2027-11-11. With at least 30 positions in each group and 20 sessions: the lower end of the 95% bootstrap range of the difference in mean R25 net of fees, on-plan minus off-plan, resampled by session (5,000 resamples, the seed, generator and percentiles of EXP-0031), is at or below 0, or that difference is at or below 0 in either half of the positions taken in order of t0 (both groups pooled, split at floor(n/2); a half with an empty group fails). Groups take their first 150 positions by t0. Sessions are the distinct New York days of t0 of the positions in either group. Fewer than 30 positions in either group or fewer than 20 sessions at that point closes the trial inconclusive. A pass changes nothing on the desk: a rule or gate built on it needs its own record."
