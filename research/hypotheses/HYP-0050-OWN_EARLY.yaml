id: HYP-0050
trial: "OWN-EARLY"
family: M                       # the owner's own trades (DEC-0045); counted apart from the global, C and O families
status: pre-registered          # DEC-0045; registered before any label exists
arm: label                      # a split of the owner's own positions by the board's end-of-day replay: no order of any kind
statement: "Among the owner's on-plan positions (in_zone or early, as HYP-0048 defines them) on full sessions, those opened from 10:00 to before 11:30 New York (the mid window, a) have a higher mean R25 net of fees than those opened from 09:35 to before 10:00 (the open window, b): late minus early. The trial is named for the open window it questions. t0 is the position's first opened_at, in New York time. Half-day sessions (as dashboard/src/lib/market-calendar.json marks them) and positions opened outside both windows are in neither group. The direction was chosen knowing that the owner's reconstructed record had its weakest hour at the open (DEC-0030) and that the Trades page already shows dollars by the hour opened; no on-plan result in either window has been seen."
rule: late_vs_early_window  # groups: a = mid_window [10:00, 11:30); b = open_window [09:35, 10:00), New York, full sessions only
frozen: {among: [in_zone, early], groups: {a: mid_window, b: open_window}, difference: a_minus_b, open_window: ['09:35', '10:00'], mid_window: ['10:00', '11:30'], clock: America/New_York, half_days: excluded, half_day_source: dashboard/src/lib/market-calendar.json, max_per_group: 150, measure: R25_net, also_reported: [R50_net, R25_gross, R50_gross], fees: {open: 0.55, close: 0.56, expired_close: 0}}
config: research/experiments/EXP-0031-owner-trades-board/config.yaml
evidence: {decision: DEC-0045, experiments: [EXP-0031-owner-trades-board]}
since: "the first New York session after the release that first writes labels reaches production (DEC-0045, a frozen copy of the engine whose ENGINE_VERSION is the content hash of its files in that release; labels written once per session from IEX bars asked for by name (DEC-0049), never worked out again; no one runs the labeller on the owner's journal before that release); never backfilled. Sessions replayed under another ENGINE_VERSION are left out and counted. Ends early, with whatever it has, on an amendment to DEC-0035, a change to the value of a rule limit in dashboard/src/lib/trade-rules.ts (a rename or moved code is not one), a change to the journal importer's matching, a journal with fees_included true or the production ALPACA_FEED resolving to sip (DEC-0049: then the trial closes inconclusive with no verdict, whatever the counts, and with no session if before the release that first writes labels); the last session counted is then the last full session before the change reaches production"
close_without_verdict: "2027-11-11"
falsified_if: "Read once, at the first of: both groups at 150 positions, the window ending, or 2027-11-11. With at least 30 positions in each group and 20 sessions: the lower end of the 95% bootstrap range of the difference in mean R25 net of fees, 10:00-11:30 minus 09:35-10:00 (late minus early), resampled by session (5,000 resamples, the seed, generator and percentiles of EXP-0031), is at or below 0, or that difference is at or below 0 in either half of the positions taken in order of t0 (both groups pooled, split at floor(n/2); a half with an empty group fails). Groups take their first 150 positions by t0. Sessions are the distinct New York days of t0 of the positions in either group. Fewer than 30 positions in either group or fewer than 20 sessions at that point closes the trial inconclusive. A pass changes nothing on the desk: moving the first entry needs its own record."
