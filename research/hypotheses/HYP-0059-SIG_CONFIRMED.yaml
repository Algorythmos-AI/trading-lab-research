id: HYP-0059
trial: "SIG-CONFIRMED"
family: O                       # the options desk's entry rules and the filters tried on them (DEC-0028, DEC-0041); total 36 with this one
status: pre-registered          # DEC-0051 (proposed 2026-11-13); registered before any signal, gate value or outcome exists
arm: signal                     # a split of the board's own enter-zone breaks by the server's sealed signal word: no order of any kind
statement: "On counted forward sessions (DEC-0051 section 8: at least 90% of the session's expected slots hold a signal record and have a usable SIP board-feed stamp), breaks whose first enter_zone slot reads CALL (call side) or PUT (put side) have a higher mean R on the stock than breaks whose first enter_zone slot reads WAIT or NO TRADE because at least one market gate was read and failed, and whose contract check passed. A break is one (session, focus name, side, brokeAt) whose side reads enter_zone in the DEC-0044 log; it is scored once, from that first enter_zone slot, whatever its word later. CALL or PUT there means: the side's own board state enter_zone, neither brokeEarlier nor gap, all four market gates passing (market direction from SPY and QQQ as EXP-0034 config.yaml copies it, the volume of the bar ending at brokeAt against its slot's 20-session median, the stock's NBBO spread, no shock bar and no scheduled release in its window) and a contract passing the contract check (OPRA, the expiry rule of EXP-0034 config.yaml parameters.expiry_rule, strikes nearest the money first, the ticket sizing at least one contract at the ask under MAX_PREMIUM and RISK_PER_TRADE with the -25% premium stop and the owner's fees, its bid-ask at most the frozen share of the distance from mid to the premium stop, a two-sided quote within the frozen age and its own time within the frozen limit, the frozen day volume, a delta from the feed). Counted, not scored: not_logged, not_usable, gate_unavailable, contract_failed (the contract check did not pass, whatever the market gates read), bars_incomplete, no_entry_bar, and every break of a log_incomplete session. The entry is the open of the first 2-minute bar starting at or after the scoring record's evaluation time; from that bar the exit is EXP-0032 config.yaml outcome.after_fill (DEC-0047 section 3, exit policy card) with the card's T1 and stop frozen in DEC-0051 section 8 under DEC-0035 section 3 (ENTRY_ATR 0.01, STOP_ATR 0.1, MIN_ROOM_MULTIPLE 2; call level breakout_above else resistance.price, put level hold_above else support.price); R = sign x (exit - entry_open) / |card entry - card stop|, 2 decimals, on SIP bars fetched and joined as EXP-0032 config.yaml bars says. Only the edition's focus names are ever covered (EXP-0032's blind)."
rule: confirmed_minus_market_gate_failed   # a = CALL or PUT at the first enter_zone slot; b = WAIT or NO TRADE there from a read, failed market gate, contract passed
frozen: {unit: break, break_key: [session, symbol, side, brokeAt], scoring_slot: first_enter_zone_slot, groups: {a: call_or_put, b: market_gate_failed_contract_passed}, excluded: [not_logged, not_usable, gate_unavailable, contract_failed, other, bars_incomplete, no_entry_bar, log_incomplete], entry: open_of_first_bar_starting_at_or_after_evaluation, exit: "EXP-0032 config.yaml outcome.after_fill, by reference", card: {ENTRY_ATR: 0.01, STOP_ATR: 0.1, MIN_ROOM_MULTIPLE: 2, call_level: breakout_above_else_resistance, put_level: hold_above_else_support}, difference: a_minus_b, measure: mean_stock_R, counted_session: "at least 90% of expectedSlots logged with a usable SIP board-feed stamp", resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261159, interval: [2.5, 97.5], percentile: numpy_linear, halves: "counted sessions in date order, the first floor(n/2) then the rest; a half with an empty group fails", read_at: {group_a_breaks: 100, close_date: one year after acceptance}, too_few: {per_group: 30, sessions: 20}, gates_numbers: "frozen by DEC-0051 Amendment 1 under the rule of DEC-0051 section 2", secondary: [option_R25_from_logged_quotes, sensitivity_table]}
config: research/experiments/EXP-0034-desk-signal-gates/config.yaml
evidence: {decision: DEC-0051, experiments: [EXP-0034-desk-signal-gates]}
since: "the first regular New York session that opens after: the four preconditions of DEC-0051 section 8 (the per-slot range baseline in production, the read script merged, the outcome code merged and frozen, one full session stamped by the board-feed stamp), DEC-0051's Amendment 1 merged and in production, and the signal switch (desk/signal.json) first reading log or show in production; forward only, never backfilled, no dry session in it. Signals are worked out only on the server, per settled slot, and sealed create-only at desk/signal/<day>/<HHMM>.json after the slot's DEC-0044 record; a slot with no record is a gap and is never filled in. Every early end closes the trial with no verdict, whatever the counts, and the trial stays counted: an amendment to DEC-0035 that changes a card number or a change to the frozen card numbers; a change to MAX_PREMIUM, RISK_PER_TRADE, PREMIUM_STOP or OWNER_FEES; an engine change the identity check finds (or a label change shipped without the check); a change to a gate's definition or to a number Amendment 1 froze; a change to the signal code's hash; an edit to a past or the current session's calendar row; a change to a feed (anything but SIP for the stock or OPRA for the option, or a DEC-0050 board-feed stamp reading other than sip); a change to the frozen outcome code; or a breach of DEC-0051 section 5's blinds or of section 3's rule that the page shows only the log (EXP-0034 config.yaml)"
close_without_verdict: "one year after the date DEC-0051 is accepted (written into EXP-0034 README.md by the pull request that accepts it)"
falsified_if: "Read once, at the first of: 100 scored breaks in group a, or the close date; later breaks are not taken. With at least 30 scored breaks in each group and 20 counted sessions: the lower end of the 95% bootstrap range of mean R (a) minus mean R (b), resampling counted sessions with replacement (5,000 resamples, mulberry32 seeded 20261159, numpy linear percentiles), is at or below 0, or that difference is at or below 0 in either half of the counted sessions in date order (a half with an empty group fails). Fewer than 30 scored breaks in either group or fewer than 20 counted sessions is too few to judge: an exploratory mark, not proof. Supported: the tag changes from Testing HYP-0059 to 'Stock test passed (HYP-0059); option result not tested', by the pull request that records the verdict; nothing is called proven for options. Not supported (falsified, too few or an early end): the signal words are withdrawn by that pull request and the gates stay on the page as plain facts. Reported, tested on nothing: each group a break's option R25 from the logged quotes, and the sensitivity table (by time window, SPY and QQQ against single names, group b re-weighted to group a's name and window mix)."
