id: HYP-0054
trial: "SEL-RANK"
family: F                       # the two-stage selection's accuracy (DEC-0047); counted apart from the global, C, O and M families
status: pre-registered          # DEC-0047 (proposed 2026-11-12, revised blind the same day); registered before any session of the selection exists
arm: selection                  # a comparison of the selection's names by the ledger's stock outcome: no order of any kind
statement: "On counted sessions, better Stage 1 final ranks go with higher R among eligible names. Unit, outcome, side and bars as HYP-0051; R per triggered side, as HYP-0051 (DEC-0047 section 3): an entered name's card-policy R, 0 for a triggered name without an entry, no R for a name with no trigger. Per session, rho_s = Spearman's correlation between the final rank (DEC-0046 R3) and R over the ranked Stage 1-eligible scored names that triggered: each variable ranked with average ranks for ties, then Pearson's correlation of the two rank vectors. Rank 1 is first, so the session statistic is -rho_s. A session with fewer than 3 such names, or with every R equal or every rank equal, is excluded and counted. The statistic is the mean of -rho_s over the included sessions."
rule: mean_negative_spearman_rank_r
frozen: {session_statistic: "-rho_s, Spearman (average ranks, Pearson on ranks) of final rank and R", names: ranked_stage1_eligible_scored_triggered, triggered_no_entry_r: 0, min_names_per_session: 3, constant_r_or_rank: excluded, statistic: "mean over included sessions", resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261147, p_one_sided: "(1 + #{resampled mean <= 0}) / 5001", holm: {family: [HYP-0052, HYP-0054, HYP-0055], level: 0.025, inconclusive_p: 1}, halves: "included sessions in date order, the first floor(n/2) then the rest", min_counted_sessions: 60, min_included_sessions: 30}
config: research/experiments/EXP-0032-selection-forward/config.yaml
evidence: {decision: DEC-0047, experiments: [EXP-0032-selection-forward]}
since: "the first regular New York session on which the edition's focus names are the Stage 1 picks under DEC-0048's switch (precondition 4), once preconditions 1 to 3 of DEC-0047 section 10 are met (the ledger change, the card fields of every data-valid name, the frozen analysis code); forward only, never backfilled. A session counts only as DEC-0047 section 1 says. Ends early at the last session before any of these reaches production: a dated amendment to DEC-0046 that changes the selection, a change to the universe, a change to the card-field code, an amendment to DEC-0035 that changes a card number, a change to the frozen outcome rule, or a change to the analysis code other than a defect fix DEC-0047 section 10 allows. Every early end closes the experiment with no verdict, and a breach of the blind rule (DEC-0047 section 8) makes it unreadable; either counts as inconclusive for DEC-0047 section 9"
close_without_verdict: "2027-09-30"
falsified_if: "Read once, with HYP-0051. With at least 60 counted and 30 included sessions: the Holm-adjusted one-sided p across HYP-0052, HYP-0054 and HYP-0055 (family level 0.025; an inconclusive test enters with p = 1) is above 0.025, or the mean of -rho_s is at or below 0 in either half of the included sessions in date order (the first floor(n/2), then the rest). Below the minimums, inconclusive. Falsified means only that the registered condition was not met; the point estimate and range are reported beside it."
