arm: tag                        # a subset of EXP-0029's own decisions: no order of its own, the control unchanged
statement: "Among the clone's break-and-retest (OC-RETEST) trades of EXP-0029 in QQQ, those entered while SMH is against the trade have a lower mean return on premium after fees than the other QQQ trades. SMH's tape is read with wt.options.regime.read on its 2-minute bars with the clone's numbers, at the same bar close as the entry. Against, the mirror of the SPY half of the trend gate: a call with SMH's close below its VWAP, or a put with SMH's close above it (equal is not against). A QQQ trade without an SMH tape at that bar is in neither group and is counted apart. Trades in other names are not in this trial."
rule: retest                # the base setup (HYP-0029); the flag `leader_against` is written into the decision log beside the gates
