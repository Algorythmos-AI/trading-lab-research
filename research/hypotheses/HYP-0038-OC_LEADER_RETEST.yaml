since: "the first session of job paper-o that runs a release writing the DEC-0041 tags into the decision log (research_arms on); never backfilled. Ends early, with whatever it has, on the last session under EXP-0029's frozen config if that config changes"
close_without_verdict: "2027-11-05"
falsified_if: "With at least 30 trades in each group (QQQ tagged and QQQ rest) and 20 sessions: the lower end of the 95% bootstrap range of the difference in mean return on premium after fees, the other QQQ trades minus the tagged ones, resampled by session, is at or below 0, or that difference is at or below 0 in either half of the trades taken in order. Fewer than 30 trades in either group by 2027-11-05 closes the trial with no verdict. A pass changes no rule: a gate built on it needs its own record and new trials."
