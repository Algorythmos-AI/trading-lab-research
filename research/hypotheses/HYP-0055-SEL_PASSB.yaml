id: HYP-0055
trial: "SEL-PASSB"
family: F                       # the two-stage selection's accuracy (DEC-0047); counted apart from the global, C, O and M families
status: pre-registered          # DEC-0047 (proposed 2026-11-12, revised blind the same day); registered before any session of the selection exists
arm: selection                  # a comparison of the selection's names by the ledger's stock outcome: no order of any kind
statement: "On counted sessions, Stage 1-eligible scored names whose Pass B status (DEC-0046 section 5) was confirmed have a higher mean R per triggered side than those whose Pass B status was no_longer_qualifies. Unit, outcome, side and bars as HYP-0051; R per triggered side, as HYP-0051 (DEC-0047 section 3): an entered name's card-policy R, 0 for a triggered name without an entry, no R for a name with no trigger; eligible names, picked or not. Pooled over the names of the included sessions: mean R per triggered side of confirmed names minus the same for no_longer_qualifies names. caution and not_confirmed names are in neither group and are counted. A session whose Pass B was published before the dated amendment freezing Stage 2's four thresholds, carries a status outside DEC-0046's four (confirmed, caution, not_confirmed, no_longer_qualifies), or is missing or late (not published by 09:25 New York) is unclassified: its names are excluded from this test and counted."
rule: confirmed_minus_no_longer_qualifies_pooled
frozen: {names: stage1_eligible_scored, groups: {a: [confirmed], b: [no_longer_qualifies]}, neither: [caution, not_confirmed], unclassified_sessions: excluded_and_counted, pooling: names_of_included_sessions, triggered_no_entry_r: 0, resamples: 5000, resample_unit: "session, bringing all its names", empty_group: "discarded, drawing continues until 5,000 are kept", prng: mulberry32, seed: 20261147, p_one_sided: "(1 + #{resampled difference <= 0}) / 5001", holm: {family: [HYP-0052, HYP-0054, HYP-0055], level: 0.025, inconclusive_p: 1}, halves: "included sessions in date order, the first floor(n/2) then the rest; a half with an empty group fails", min_counted_sessions: 60, min_included_sessions: 30, min_triggered_names_per_group: 30}
config: research/experiments/EXP-0032-selection-forward/config.yaml
evidence: {decision: DEC-0047, experiments: [EXP-0032-selection-forward]}
since: "the first regular New York session on which the edition's focus names are the Stage 1 picks under DEC-0048's switch (precondition 4), once preconditions 1 to 3 of DEC-0047 section 10 are met (the ledger change, the card fields of every data-valid name, the frozen analysis code); forward only, never backfilled. A session counts only as DEC-0047 section 1 says. Ends early at the last session before any of these reaches production: a dated amendment to DEC-0046 that changes the selection, a change to the universe, a change to the card-field code, an amendment to DEC-0035 that changes a card number, a change to the frozen outcome rule, or a change to the analysis code other than a defect fix DEC-0047 section 10 allows. Every early end closes the experiment with no verdict, and a breach of the blind rule (DEC-0047 section 8) makes it unreadable; either counts as inconclusive for DEC-0047 section 9"
close_without_verdict: "2027-09-30"
falsified_if: "Read once, with HYP-0051. With at least 60 counted sessions, 30 included sessions and 30 triggered names in each group: the Holm-adjusted one-sided p across HYP-0052, HYP-0054 and HYP-0055 (family level 0.025; an inconclusive test enters with p = 1) is above 0.025, or the pooled difference is at or below 0 in either half of the included sessions in date order (the first floor(n/2), then the rest; a half with an empty group fails). Below the minimums, inconclusive; no_longer_qualifies is expected to be rare, so this test may well close inconclusive. Falsified means only that the registered condition was not met; the point estimate and range are reported beside it."
