id: HYP-0044
trial: "OC-RUNNER-RETEST"
family: O                       # options desk (DEC-0028); counted in family O (DEC-0041)
status: pre-registered          # DEC-0041; registered before any shadow result exists
arm: shadow                     # virtual trades from wt.options.shadow on the runner's own tape and fills: no order
statement: "On each of the clone's break-and-retest (OC-RETEST) trades of EXP-0029, a virtual second contract bought at the same fill and managed as a runner has a higher return on premium after fees than the real contract under the control's exits. The runner's exits, the first that fires, each priced at the bid of the first quote at or after it: before breakeven, the bid at or below 75% of the fill or a 2-minute close beyond the signal's invalidation; once the bid has reached 125% of the fill, the stop moves to the fill; after that, a finished 2-minute close on the wrong side of Tape.ema_fast (the 9-period EMA of 2-minute closes: below it for a call, above it for a put); the stock reaching the next level the control aims at (setups.next_level); and 15:10 (12:10 on a half day). No 50% target and no 5-minute time stop. When the control is closed by a safety exit (blind exit, stale quote, kill switch, a latch, the 15:10 flatten), the runner closes with it at the same price. Virtual only: never an order."
rule: retest                # the base setup (HYP-0029); the runner is paired with each of its real fills
frozen: {same_contract_and_fill: true, premium_stop_pct: 25, breakeven_after_pct: 25, trail: Tape.ema_fast, trail_ema: 9, trail_bars_minutes: 2, trail_from: breakeven, take_profit_at_next_level: true, target_pct: none, time_stop_min: none, flat: '15:10', half_day_flat: '12:10', fee_per_contract_each_way: 0.03}
config: config/options_clone.yaml
evidence: {decision: DEC-0041, experiments: [EXP-0030-options-clone-research-arms], base: HYP-0029}
since: "the first session of job paper-o that runs a release containing wt.options.shadow (research_arms on); never backfilled. Ends early, with whatever it has, on the last session under EXP-0029's frozen config if that config changes"
close_without_verdict: "2027-11-05"
falsified_if: "With at least 30 trades and 20 sessions: the lower end of the 95% bootstrap range of the mean paired difference per trade (runner minus control, return on premium after $0.03 a contract each way), resampled by session, is at or below 0, or the mean difference is at or below 0 in either half of the trades taken in order. Fewer than 30 trades by 2027-11-05 closes the trial with no verdict. A pass places no order: trading the runner needs its own record and new trials."
