id: HYP-0049
trial: "OWN-CAUTION"
family: M                       # the owner's own trades (DEC-0045); counted apart from the global, C and O families
status: pre-registered          # DEC-0045; registered before any label exists
arm: label                      # a split of the owner's own positions by the board's end-of-day replay: no order of any kind
statement: "Among the owner's on-plan positions (in_zone or early, as HYP-0048 defines them), those opened with no DEC-0042 caution and no unknown check on their side at t0 have a higher mean R25 net of fees than those opened with at least one caution. The cautions are all the ones entryChecks (dashboard/src/lib/entry-checks.ts, in the frozen copy of DEC-0045) returns for entryChecks(input, kind) at now = t0, with the inputs the replay builds only from bars ended by t0, not only the two the desk shows: range (middle of range), gap (gap not filled), leader (SMH against, QQQ only), iv (implied volatility above the cap), late (the 2-minute bar forming at t0 ends from 11:00 to 14:30 New York, full days only), winner (a journal piece of any kind closed earlier that day before t0 with pnl > 0, before fees). The desk-only early caution of DEC-0043 (before10) is not a caution for this test. A position with no caution but at least one check the replay could not run (entryChecks' unknown) is in neither group and is counted."
rule: no_caution_vs_caution  # groups: clean = no caution and no unknown check; cautioned = at least one caution
frozen: {among: [in_zone, early], cautions: [range, gap, leader, iv, late, winner], not_a_caution: [before10], all_returned_count: true, late: ['11:00', '14:30'], groups: {a: no_caution_no_unknown, b: at_least_one_caution}, difference: a_minus_b, excluded: no_caution_with_unknown, max_per_group: 150, measure: R25_net, also_reported: [R50_net, R25_gross, R50_gross], fees: {open: 0.55, close: 0.56, expired_close: 0}}
config: research/experiments/EXP-0031-owner-trades-board/config.yaml
evidence: {decision: DEC-0045, experiments: [EXP-0031-owner-trades-board]}
since: "the first New York session after the release that first writes labels reaches production (DEC-0045, a frozen copy of the engine whose ENGINE_VERSION is the content hash of its files in that release; labels written once per session from IEX bars asked for by name (DEC-0049), never worked out again; no one runs the labeller on the owner's journal before that release); never backfilled. Sessions replayed under another ENGINE_VERSION are left out and counted. Ends early, with whatever it has, on an amendment to DEC-0035, a change to the value of a rule limit in dashboard/src/lib/trade-rules.ts (a rename or moved code is not one), a change to the journal importer's matching, a journal with fees_included true or the production ALPACA_FEED resolving to sip (DEC-0049: then the trial closes inconclusive with no verdict, whatever the counts, and with no session if before the release that first writes labels); the last session counted is then the last full session before the change reaches production"
close_without_verdict: "2027-11-11"
falsified_if: "Read once, at the first of: both groups at 150 positions, the window ending, or 2027-11-11. With at least 30 positions in each group and 20 sessions: the lower end of the 95% bootstrap range of the difference in mean R25 net of fees, no caution minus at least one, resampled by session (5,000 resamples, the seed, generator and percentiles of EXP-0031), is at or below 0, or that difference is at or below 0 in either half of the positions taken in order of t0 (both groups pooled, split at floor(n/2); a half with an empty group fails). Groups take their first 150 positions by t0. Sessions are the distinct New York days of t0 of the positions in either group. Fewer than 30 positions in either group or fewer than 20 sessions at that point closes the trial inconclusive. A pass changes nothing on the desk: no caution becomes a rule without its own record."
