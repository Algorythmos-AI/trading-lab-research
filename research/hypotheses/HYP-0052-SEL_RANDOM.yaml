id: HYP-0052
trial: "SEL-RANDOM"
family: F                       # the two-stage selection's accuracy (DEC-0047); counted apart from the global, C, O and M families
status: pre-registered          # DEC-0047 (proposed 2026-11-12, revised blind the same day); registered before any session of the selection exists
arm: selection                  # a comparison of the selection's names by the ledger's stock outcome: no order of any kind
statement: "On counted sessions, the picked names have a higher mean R per triggered side than random draws of the same number of names from that session's Stage 1-eligible scored names, picks included. Unit, outcome, side and bars as HYP-0051 (DEC-0047 sections 2 and 3); R per triggered side, as HYP-0051 (DEC-0047 section 3): an entered name's card-policy R, 0 for a triggered name without an entry, no R for a name with no trigger. Per session, k = the number of scored picks; 1,000 draws of k names without replacement, each a partial Fisher-Yates shuffle starting from the eligible scored names sorted by symbol A to Z (for i = 0 to k - 1: j = i + floor(u x (n - i)), swap positions i and j; the draw is the first k), u = next() / 2**32 from one mulberry32 generator seeded 20261152 at the start, sessions in date order, draws 1 to 1,000 in order. D_s = mean R per triggered side of the picked names minus the mean, over the draws holding at least one triggered name, of each draw's mean R per triggered side. A session whose picks have no triggered name, or whose draws have none, is excluded and counted; the generator runs on through them."
rule: picked_minus_random_k_per_session
frozen: {draws_per_session: 1000, draw_from: stage1_eligible_scored_names_picks_included, draw_size: number_of_scored_picks, draw_start: sorted_list_each_draw, draw_prng: mulberry32, draw_seed: 20261152, draw_order: "sessions by date, names by symbol", triggered_no_entry_r: 0, statistic: "mean over included sessions of D_s", resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261147, p_one_sided: "(1 + #{resampled mean <= 0}) / 5001", holm: {family: [HYP-0052, HYP-0054, HYP-0055], level: 0.025, inconclusive_p: 1}, halves: "included sessions in date order, the first floor(n/2) then the rest", min_counted_sessions: 60, min_included_sessions: 30}
config: research/experiments/EXP-0032-selection-forward/config.yaml
evidence: {decision: DEC-0047, experiments: [EXP-0032-selection-forward]}
since: "the first regular New York session on which the edition's focus names are the Stage 1 picks under DEC-0048's switch (precondition 4), once preconditions 1 to 3 of DEC-0047 section 10 are met (the ledger change, the card fields of every data-valid name, the frozen analysis code); forward only, never backfilled. A session counts only as DEC-0047 section 1 says. Ends early at the last session before any of these reaches production: a dated amendment to DEC-0046 that changes the selection, a change to the universe, a change to the card-field code, an amendment to DEC-0035 that changes a card number, a change to the frozen outcome rule, or a change to the analysis code other than a defect fix DEC-0047 section 10 allows. Every early end closes the experiment with no verdict, and a breach of the blind rule (DEC-0047 section 8) makes it unreadable; either counts as inconclusive for DEC-0047 section 9"
close_without_verdict: "2027-09-30"
falsified_if: "Read once, with HYP-0051. With at least 60 counted and 30 included sessions: the Holm-adjusted one-sided p across HYP-0052, HYP-0054 and HYP-0055 (family level 0.025; an inconclusive test enters with p = 1) is above 0.025, or the mean of D_s is at or below 0 in either half of the included sessions in date order (the first floor(n/2), then the rest). Below the minimums, inconclusive. Falsified means only that the registered condition was not met; the point estimate and range are reported beside it."
