id: HYP-0052
trial: "SEL-RANDOM"
family: F                       # the two-stage selection's accuracy (DEC-0047); counted apart from the global, C, O and M families
status: pre-registered          # DEC-0047 (proposed 2026-11-12); registered before any session of the selection exists
arm: selection                  # a comparison of the selection's names by the ledger's stock outcome: no order of any kind
statement: "On counted sessions, the picked names have a higher mean R per entered side than random draws of the same number of names from that session's Stage 1-eligible scored names. Unit, outcome, side and bars as HYP-0051 (DEC-0047 sections 2 and 3). Per session, k = the number of picks; 1,000 draws of k names without replacement, each a partial Fisher-Yates shuffle of the eligible scored names sorted by symbol A to Z (for i = 0 to k - 1: j = i + floor(u x (n - i)), swap positions i and j; the draw is the first k), u = next() / 2**32 from one mulberry32 generator seeded 20261152 at the start, sessions in date order, draws 1 to 1,000 in order. D_s = mean R of the picked names with R minus the mean, over the draws holding at least one name with R, of each draw's mean R. A session whose picks have no R, or whose draws have none, is excluded and counted; the generator runs on through them."
rule: picked_minus_random_k_per_session
frozen: {draws_per_session: 1000, draw_from: stage1_eligible_scored_names, draw_size: number_of_picks, draw_prng: mulberry32, draw_seed: 20261152, draw_order: "sessions by date, names by symbol", statistic: "mean over included sessions of D_s", resamples: 5000, resample_unit: session, prng: mulberry32, seed: 20261147, p_one_sided: "(1 + #{resampled mean <= 0}) / 5001", holm: {family: [HYP-0052, HYP-0053, HYP-0054, HYP-0055], level: 0.025, inconclusive_p: 1}, halves: "included sessions in date order, split at floor(n/2)", min_counted_sessions: 60, min_included_sessions: 30}
config: research/experiments/EXP-0032-selection-forward/config.yaml
evidence: {decision: DEC-0047, experiments: [EXP-0032-selection-forward]}
since: "the first regular New York session on which the edition's focus names are the Stage 1 picks under DEC-0048's switch, once the ledger change of DEC-0047 section 10 is merged (precondition 1); forward only, never backfilled. A session counts only as DEC-0047 section 1 says. Ends early, and is read then under the same rules, at the last session before a dated amendment to DEC-0046 that changes the selection, an amendment to DEC-0035 that changes a card number, or a change to the frozen outcome rule reaches production; a breach of the blind rule (DEC-0047 section 8) ends it as unreadable"
close_without_verdict: "2027-09-30"
falsified_if: "Read once, with HYP-0051. With at least 60 counted and 30 included sessions: the Holm-adjusted one-sided p across HYP-0052 to HYP-0055 (family level 0.025; an inconclusive test enters with p = 1) is above 0.025, or the mean of D_s is at or below 0 in either half of the included sessions in date order. Below the minimums, inconclusive."
