id: HYP-0056
trial: "OWN-ONPLAN-SIP"
family: M                       # the owner's own trades (DEC-0045); counted apart from the global, C and O families
status: pre-registered          # DEC-0050; registered before any label exists, on any feed
arm: label                      # a split of the owner's own positions by the board's end-of-day replay: no order of any kind
statement: "The owner's long single-leg option positions opened while the board showed their side on plan (in_zone or early) have a higher mean R25 net of fees than those opened off plan (off_plan). Labels are written once per buy fill and a position takes its first fill's label. A position is the long call or put pieces of one contract (symbol, kind, strike, expiry) opened on one New York day: pieces sorted by opened_at join the current group while their opened_at is strictly before the group's latest closed_at so far, and a piece opened at or after it starts a new position; stock and short pieces are left out, and a position with an open lot, cost 0 or a piece listed in the journal's gaps is left out and counted. R25 = (journal pnl - fees) / (0.25 x premium cost), fees $0.55 a contract opened and $0.56 a contract closed (none on a piece left to expire), the journal's fees_included being false or null. Labels come from the end-of-day replay of the session's stored edition and settled 2-minute SIP bars, asked for by name, through a frozen copy of the desk's engine (DEC-0045 section 3, carried over by DEC-0050): nameState evaluated once per 2-minute bar at the bar's end + 5 s and at 09:35:00, 11:30:00, 13:00:00 and 15:10:00 New York, from inputs built only from bars ended by then, a side's state being its nameState side state while the row is neither no_trade nor paused, over half-open intervals. At t0 = the position's first opened_at, on the position's own side, the label is the first that applies of: no_record (edition missing, bars incomplete from 09:30 to t0, the side carries gap or brokeEarlier, no edition in force at t0, a half-day mismatch between the calendar and the edition, neither a sip stamp in the 2 minutes before t0 nor two consecutive sip stamps either side of it (feed_unknown), or t0 within 2 minutes after a 10-minute run without a SIP answer (board_off); EXP-0033 config.yaml), not_focus, in_zone (t0 in an enter_zone interval extended by 60 s at its end), early (t0 in a get_ready interval), alt (an alternative trigger with alt.side equal to the position's kind was live while the row was neither no_trade nor paused), off_plan. alt, not_focus and no_record positions are in neither group and are counted."
rule: on_plan_vs_off_plan   # groups: on_plan = {in_zone, early}; off_plan = {off_plan}
frozen: {groups: {a: [in_zone, early], b: [off_plan]}, difference: a_minus_b, excluded: [alt, not_focus, no_record], label_order: [no_record, not_focus, in_zone, early, alt, off_plan], measure: R25_net, also_reported: [R50_net, R25_gross, R50_gross], zone_extend_s: 60, state_valid_from: bar_end_plus_CLOSE_GRACE_MS_and_board_boundaries, intervals: half_open, max_per_group: 150, fees: {open: 0.55, close: 0.56, expired_close: 0}}
config: research/experiments/EXP-0033-owner-trades-board-sip/config.yaml
evidence: {decision: DEC-0050, experiments: [EXP-0033-owner-trades-board-sip]}
since: "the first New York session after the release that first writes EXP-0033's labels reaches production, which waits for the cutover note of DEC-0050 point 1 (a frozen copy of the engine whose version is DEC-0045's content hash of its five files in that release, and a frozen calendar; labels written once per buy fill from SIP bars asked for by name, never through ALPACA_FEED, never worked out again; no one runs the labeller on the owner's journal before that release); never backfilled. A position whose t0 has neither a sip stamp in the 2 minutes before it nor two consecutive sip stamps either side of it (feed_unknown) or that follows a 10-minute run without a SIP answer (board_off) is no_record and counted. Every early end closes the trial inconclusive with no verdict, whatever the counts: an amendment to DEC-0035, a change to the value of a rule limit in dashboard/src/lib/trade-rules.ts (a rename or moved code is not one), a change to the journal importer's matching, a journal with fees_included true, any stamp after the start reading other than sip, a stamp gap over 10 minutes with a deployment change across it, a broken stamp chain or missing manifest, a change to the frozen engine copy or a past session's calendar entry, or a session's bars fetch still failing 5 sessions later (EXP-0033 config.yaml)"
close_without_verdict: "2027-11-12"
falsified_if: "Read once, at the first of: both groups at 150 positions or 2027-11-12 (an early end gives no verdict). With at least 30 positions in each group and 20 sessions: the lower end of the 95% bootstrap range of the difference in mean R25 net of fees, on-plan minus off-plan, resampled by session (5,000 resamples, the seed, generator and percentiles of EXP-0033), is at or below 0, or that difference is at or below 0 in either half of the positions taken in order of t0 (both groups pooled, split at floor(n/2); a half with an empty group fails). Groups take their first 150 positions by t0. Sessions are the distinct New York days of t0 of the positions in either group. Fewer than 30 positions in either group or fewer than 20 sessions at that point closes the trial inconclusive. A pass changes nothing on the desk: a rule or gate built on it needs its own record."
