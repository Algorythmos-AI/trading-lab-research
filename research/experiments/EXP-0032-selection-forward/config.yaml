# EXP-0032: whether the two-stage selection (DEC-0046) picks better names, forward from the switch (DEC-0047).
# Design only: no session of the selection exists, and no outcome, scorecard, report or backtest was used to write it.
# Revised on 2026-11-12, after a blind review, by an editor who had seen no result (DEC-0047's opening lines).
# Frozen with DEC-0047; a changed value is a new experiment and new trials, except that a decision record may amend it
# before the first counted session, saying that no outcome of the selection was viewed to choose the change.
experiment: EXP-0032
status: proposed                    # registered when DEC-0047 is accepted; no results file until the read writes it once
decision: DEC-0047
family: F                           # the selection's accuracy; total 5 (config/trial_registry.yaml)
trials:                             # every difference is a minus b
  - {hypothesis: HYP-0051, trial: SEL-PICKED, a: picked, b: rest, unit: session, role: primary}
  - {hypothesis: HYP-0052, trial: SEL-RANDOM, a: picked, b: random_draws, unit: session, role: secondary}
  - {hypothesis: HYP-0053, trial: SEL-FIXED, a: picked, b: fixed_rule, unit: session, role: co_primary_for_action}
  - {hypothesis: HYP-0054, trial: SEL-RANK, a: better_rank, b: worse_rank, unit: session, role: secondary}
  - {hypothesis: HYP-0055, trial: SEL-PASSB, a: confirmed, b: no_longer_qualifies, unit: names_pooled, role: secondary}

preconditions:                      # no session counts until all four are met (DEC-0047 section 10)
  - >-
    1. the ledger change, merged by the owner in Algorythmos-AI/focus-card-ledger: predictions for every data-valid
    name (both sides where a level exists), append-only, never backfilled, their commit on the ledger's default branch
    before 09:30 New York (push time, not recorded_at); per name picked, Stage 1 score and final rank, eligible and
    its reason, params_sha, picker_ref, bundle_sha, and the Pass B status as its own record; the bars below for all
    names, saved with their hash and never overwritten; outcomes append-only; corporate actions for split_on_session;
    the scoring functions unchanged; the blind rule and its ledger test
  - >-
    2. Stage 1's output (or the published edition) carries, for every data-valid name, atr, breakout_above,
    hold_above, target_up, target_down, resistance.name, support.name, bias and close; from the card-field code of
    DEC-0046 section 6, which waits on a file the owner has not yet supplied
  - >-
    3. the analysis code frozen: verdict script, bar fetch and join, usable-bars test, side rule and the zero R of a
    triggered name without an entry, unit and group assembly, generator, bootstrap, Holm and draws, merged with
    synthetic-data tests (including generator_test_vectors) and the dashboard blind test; its commit in README.md
  - >-
    4. DEC-0048's switch, naming the first session on which the edition's focus names are the Stage 1 picks

sessions:
  start: the first regular New York session on which the edition's focus names are the Stage 1 picks (DEC-0048)
  backfill: never
  counted_when:                     # all must hold; otherwise listed with the reason and in no test
    - {rule: "on or after the start, and the edition's focus names that day are the Stage 1 picks", else: not_switched}
    - {rule: "a Stage 1 output for S published before 09:30 New York on S", else: no_stage1}
    - {rule: "its params_sha is the one in force at the first counted session (README)", else: other_params}
    - {rule: "a ledger prediction for every data-valid name, not backfilled, pushed before 09:30 New York on S", else: no_prediction}
    - {rule: "the session's SIP bars fetched and saved as bars says", else: no_bars}
  revert: a dated note in README.md written before 09:30 New York on the first session it affects; each listed in the report
  read:
    when: the first of the 120th counted session, or the end of the session of 2027-09-30
    uses: the counted sessions up to and including the 120th, or all counted sessions dated on or before 2027-09-30
    once: true                      # after the last of their outcomes is recorded; sessions after the 120th unused
    by: >-
      the coordinator session on the console Mac, in a worktree of an up-to-date origin/main, running the analysis
      code at the commit in README.md (it refuses to run if an analysis file differs); the report carries the commit,
      the command and the SHA-256 of every input
    crash: >-
      a run that stops before printing any statistic may be run again after a fix in a dated README note; a run that
      printed any statistic is never repeated; the report is written once
  max_sessions: 120
  close_date: "2027-09-30"
  min_counted_sessions: 60          # fewer at the read: every trial inconclusive, no statistic worked out
  ends_early_on:                    # the last session counted is the last before the change reaches production
    - a dated amendment to DEC-0046 that changes the selection (params_sha, or code it records as a change)
    - a change to the universe (config/options_desk.yaml names)
    - a change to the card-field code (DEC-0046 section 6)
    - an amendment to DEC-0035 that changes a card number
    - a change to the frozen outcome rule
    - a change to the analysis code other than a defect fix made as precondition 3 allows
  early_end_outcome: >-
    no verdict is worked out, whatever the counts; the five trials stay counted; it counts as inconclusive for the
    pre-set action (the scoring is replaced)
  breach: a forbidden result computed or shown before the read makes the experiment unreadable; inconclusive for the pre-set action

unit:
  scored: every Stage 1 data-valid name with published card fields, on every counted session
  counted_not_scored:               # reason codes, each counted in the report
    - not_data_valid                # with its DEC-0046 validity reason
    - internal_error
    - no_card_fields
    - split_on_session              # a split ex-date on S in Alpaca's corporate actions
    - bars_incomplete
    - no_level                      # neither side has a level
    - card_fault                    # both sides trigger on one bar (floor above ceiling)
  picked: the scored Stage 1 picks for S (the first min(4, eligible) eligible names by final rank, DEC-0046 R6); an unscored pick is missing, never replaced
  rest: the Stage 1-eligible scored names not picked
  descriptive_only: [ineligible scored names (earnings_gap), unranked data-valid scored names (benchmark_missing)]

outcome:                            # DEC-0047 section 3, verbatim from the ledger's source
  ledger_repo: Algorythmos-AI/focus-card-ledger
  ledger_commit: 8130c7c460ffa08cb2d54af49d1c05ab89c215b3
  functions: [ledger/card.py derive_levels, ledger/score.py score]
  scorer_version: "1.1"
  card_rule_version: focus-card/2026-10-27
  card_numbers:                     # frozen under DEC-0035 section 3 (not an amendment)
    entry: "round(level + sg x 0.01 x atr, 2)"
    stop: "round(level - sg x 0.1 x atr, 2)"
    t1: "round(entry + sg x 2 x |entry - stop|, 2)"
    level: {call: breakout_above, put: hold_above}
    sg: {call: 1, put: -1}
    no_level: the side has no prediction
  no_entry_windows_et: [["09:30", "09:35"], ["11:30", "13:00"]]   # by bar start, half-open
  trigger: the first bar (from 09:30) whose close is strictly beyond the level
  fill: >-
    from the bar after the trigger, the first bar that touches the entry (call low <= entry, put high >= entry) and
    closes at or beyond the level on the trade side, not starting inside a no-entry window (such a bar is skipped and
    counted); a bar closing strictly through the stop first gives failed_before_retest; the session ending first gives
    no_fill
  policy: card                      # T1, or the stop at that close, or the session close
  after_fill: >-
    from the fill bar: target1 when the high (call) or low (put) reaches T1, exit at T1; stopped when a bar after the
    fill bar closes strictly through the stop, exit at that close; both on one bar: stopped at that close
    (same_bar_conflict, the stop assumed first); neither by the last bar: session_close at the last bar's close
  r: "round(sg x (exit - entry) / |entry - stop|, 2); the ledger stores null for no_trigger, no_fill, failed_before_retest"
  name_side: the side whose trigger comes first (earlier trigger_time); the other side is ignored
  name_r:
    not_triggered: no R; counts toward the trigger rate
    entered: the first-triggering side's card-policy R
    triggered_no_entry: 0 (no_fill, failed_before_retest; the ledger's stored R stays null); counts toward the entry rate
  mean_r_per_triggered_side: the mean of name_r over the triggered names, entered or not
  recompute_at_read: >-
    every outcome is recomputed from the saved predictions and bars with the code of ledger_commit and compared with the
    stored outcome; a mismatch is listed and the recomputed value used
  bias: "support: day low >= floor; breakout: session close > ceiling; range or null floor or ceiling: none"

bars:
  source: Alpaca SIP (consolidated tape)
  request: {timeframe: 1Min, feed: sip, adjustment: raw, zone: America/New_York}
  kept: >-
    1-minute bars whose start is at or after 09:30 and before 16:00 (13:00 on a half day, as
    dashboard/src/lib/market-calendar.json half_days gives it); a bar starting at 16:00 (13:00) is dropped
  fetched: >-
    for all scored names together, at least 30 minutes after the close (16:30, 13:30 on a half day), paged to the end,
    saved with SHA-256; the first complete fetch is used and never replaced; a failed fetch may be retried until 23:59
    New York on S
  two_minute: >-
    a bar starts at 09:30 + 2k minutes, k = 0 to 194 (0 to 104 on a half day), and takes the first open, highest high,
    lowest low, last close and summed volume of the 1-minute bars starting in it; a slot without a 1-minute bar has no
    bar
  bar_seconds: 120
  usable: >-
    the first 2-minute bar starts at 09:30, the last at 15:58 (12:58 on a half day), and at most 5 of the session's
    slots (195, or 105 on a half day) have no bar; otherwise bars_incomplete
  max_missing_slots: 5
  session_close: the close of the last 1-minute bar starting before 16:00 (normally 15:59; 12:59 on a half day), not the closing auction

statistics:
  prng: mulberry32                  # as EXP-0031, so the numbers can be reproduced anywhere
  prng_step:
    - a = (a + 0x6D2B79F5) >>> 0
    - t = imul(a ^ (a >>> 15), a | 1)
    - t ^= t + imul(t ^ (t >>> 7), t | 61)
    - next = (t ^ (t >>> 14)) >>> 0
  u: next() / 2**32
  bootstrap_seed: 20261147          # the initial a; reseeded for each trial's bootstrap
  draw_seed: 20261152               # HYP-0052's random draws, one generator for the whole computation
  generator_test_vectors:           # the first three next() values; computed from the step above, not a result
    "20261147": [3209735247, 3386447078, 1777139272]
    "20261152": [2373859644, 3736099141, 333787253]
  resamples: 5000
  resample: >-
    draw n sessions with replacement from the trial's n included sessions, index floor(u x n); the statistic is
    recomputed on the drawn sessions (HYP-0055: every name of a drawn session comes with it)
  empty_group: >-
    HYP-0055 only: a resample with an empty group is discarded and not counted; drawing continues until 5,000 are
    kept; the generator runs on through discarded draws
  percentile: >-
    on the 5,000 sorted statistics d: h = (N - 1) x p / 100; q = d[floor(h)] + (h - floor(h)) x
    (d[floor(h) + 1] - d[floor(h)]) (numpy's linear)
  interval: [2.5, 97.5]
  p_one_sided: "(1 + number of resampled statistics <= 0) / 5001"
  halves: >-
    the trial's included sessions in date order; the first half is the first floor(n / 2) sessions, the second the
    rest; the statistic worked out in each half; a half with an empty group fails
  means: float64; R as the ledger rounds it (2 decimals); statistics reported to 4 decimals
  reported_beside_every_label: [point estimate, 2.5th and 97.5th percentiles, the statistic in each half, p where defined]
  primary:
    trial: HYP-0051
    supported: the 2.5th percentile above 0 and the statistic above 0 in both halves
    level: one-sided 2.5%, no correction
  co_primary_for_action:
    trial: HYP-0053
    supported: p at most 0.025, unadjusted, and the statistic above 0 in both halves
    level: one-sided 2.5%, no correction (keeping the scoring needs both HYP-0051 and HYP-0053)
  secondary:
    trials: [HYP-0052, HYP-0054, HYP-0055]
    holm: >-
      sort the three p ascending p(1)..p(3); adjusted p(i) = max over j <= i of min(1, (3 - j + 1) x p(j)); an
      inconclusive trial enters with p = 1
    level: 0.025
    supported: adjusted p at most 0.025 and the statistic above 0 in both halves
  min_included_sessions: 30         # per trial; fewer: inconclusive
  min_triggered_names_per_group: 30 # HYP-0055 only
  falsified: the minimums met and the trial's supported condition not met; it means only that condition was not met

trial_definitions:
  HYP-0051:
    per_session: D_s = mean R per triggered side (picked) - mean R per triggered side (rest)
    excluded: a session where either group has no triggered name (counted)
    statistic: mean of D_s over included sessions
    reported_beside: [trigger rate by group, entry rate by group, every exclusion count]
  HYP-0052:
    k: the number of scored picks that session
    draws: 1000
    draw_from: the session's Stage 1-eligible scored names, picks included, sorted by symbol A to Z
    draw: "partial Fisher-Yates, each draw starting from the sorted list: for i in 0..k-1, j = i + floor(u x (n - i)), swap i and j; the draw is the first k"
    order: sessions in date order, draws 1 to 1,000 in order, one generator seeded draw_seed
    per_session: D_s = mean R per triggered side (picked) - mean over draws holding a triggered name of each draw's mean R per triggered side
    excluded: a session whose picks have no triggered name or whose draws have none (counted); the generator runs on
    statistic: mean of D_s over included sessions
  HYP-0053:
    fixed_set: >-
      chosen before the open from the Stage 1-eligible names: SPY and QQQ, each when Stage 1-eligible, plus the two
      single names of the other ten with the highest Stage 1 ATR% (ATR14 / close, rounded to 6 decimals) among the
      Stage 1-eligible ones; ties by symbol A to Z; a member that cannot be scored is missing and not replaced; a name
      in both sets counts in both
    per_session: D_s = mean R per triggered side (picked) - mean R per triggered side (fixed set)
    excluded: a session where either has no triggered name (counted)
    statistic: mean of D_s over included sessions
  HYP-0054:
    per_session: >-
      -rho_s, rho_s Spearman's correlation of final rank (DEC-0046 R3) and R over the ranked eligible scored names that
      triggered: average ranks for ties, Pearson on the ranks
    excluded: fewer than 3 such names, or every R equal, or every rank equal (counted)
    statistic: mean of -rho_s over included sessions
  HYP-0055:
    names: the Stage 1-eligible scored names of the included sessions
    groups: {a: confirmed, b: no_longer_qualifies}
    neither: [caution, not_confirmed]
    unclassified: >-
      a Pass B published before the amendment freezing Stage 2's four thresholds, a status outside DEC-0046's four
      (confirmed, caution, not_confirmed, no_longer_qualifies), or a Pass B missing or not published by 09:25 New
      York: the session's names are excluded and counted
    statistic: mean R per triggered side (a) - mean R per triggered side (b), pooled over the included sessions' names

descriptive:                        # reported at the read, overall and by picked and the rest; no test, no claim
  - SPY and QQQ against the ten single names (mean R per triggered side, trigger rate)
  - "among entered names, the share whose exit was target1: target1 / (target1 + stopped)"
  - "bias label right: bias_correct of the call side's record (the put side's when the call has no level), not null"
  - ineligible and unranked scored names (mean R per triggered side, trigger rate, entry rate)
  - lag-1 autocorrelation of HYP-0051's D_s in date order
  - >-
    HYP-0051's 2.5th and 97.5th percentiles under a 5-session moving-block bootstrap: each resample joins blocks of 5
    consecutive included sessions, each block's start drawn as floor(u x (n - 4)), until n sessions (the last block
    cut short); 5,000 resamples, mulberry32 seeded bootstrap_seed; a sensitivity check that changes no label

blind:                              # DEC-0047 section 8
  rule: >-
    before the read no outcome of a name that was not picked (the stock R, result, trigger or fill of a ledger record,
    or anything worked out from these bars) is shown to anyone, singly or in total, for any session from the start;
    picked names' records and totals, the clone's results and the owner's trades may be shown; no page, report,
    edition or script compares picked with not-picked names or totals any outcome by rank, score, eligibility or
    Pass B status
  tests:
    - focus-card-ledger tests/test_blind_until_read.py
    - trading-lab-research dashboard/test/ledger-blind.test.ts
  also: the gate script reads no outcome (DEC-0046 section 7; tests/unit/test_select_gate.py)
  breach: makes the experiment unreadable; the five trials stay counted; the date and what was seen go in README.md; inconclusive for the pre-set action

pre_set_action: >-
  if HYP-0051 or HYP-0053 is not supported (falsified, or inconclusive, an early end or an unreadable experiment
  included), Stage 1's scoring is replaced by HYP-0053's fixed rule, under Stage 1's validity, eligibility and
  never-fill rules, by a dated decision record written after the read; only if both are supported does the scoring
  stay; the replacement is the choice of the simpler rule, not a finding that the fixed rule is better

report: "written once into this folder by the frozen verdict script (precondition 3); it refuses to overwrite"
