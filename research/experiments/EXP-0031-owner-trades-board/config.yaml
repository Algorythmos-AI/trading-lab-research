# EXP-0031: the owner's own option positions, labelled by the board's end-of-day replay (DEC-0045).
# Design only: no label, no position split and no result exists when this was written. Frozen with DEC-0045;
# a changed value is a dated amendment (the fees) or a new experiment and new trials (everything else).
experiment: EXP-0031
status: registered                  # design only; no results file until the verdict script writes it once
decision: DEC-0045
family: M                           # the owner's own trades; total 3 (config/trial_registry.yaml)
trials:                             # every difference is a minus b
  - {hypothesis: HYP-0048, trial: OWN-ONPLAN, a: on_plan, b: off_plan, difference: a_minus_b}
  - {hypothesis: HYP-0049, trial: OWN-CAUTION, a: no_caution_no_unknown, b: at_least_one_caution, difference: a_minus_b}
  - {hypothesis: HYP-0050, trial: OWN-EARLY, a: mid_window, b: open_window, difference: a_minus_b}
# OWN-EARLY is named for the open window it questions; it tests late minus early (mid_window minus open_window).

positions:
  source: the owner's journal (dashboard/src/lib/journal.schema.json, stocksdelta/journal), matched pieces
  include: {kind: [call, put], side: long}
  exclude: [stock, short]
  contract_key: [symbol, kind, strike, expiry]
  day: opened_at, New York date
  grouping:
    - pieces of one contract and New York day of opened_at, sorted by opened_at
    - >-
      a piece joins the current group while its opened_at is strictly before the group's latest closed_at so far
      (an expired piece's closed_at as the journal gives it)
    - a piece opened at or after it starts a new position, so a re-entry after a full exit is its own position
  open_lot: >-
    a position counts only once no lot of that contract opened that New York day remains in the journal's open;
    one still open when the verdict is read is left out and counted
  zero_cost_or_gap: a position with cost 0, or with a piece listed in the journal's gaps, is left out and counted
  t0: the position's first opened_at

unit:
  cost: "sum of entry x multiplier x qty over the pieces; premium only, fees not added"
  gross_pnl: "sum of the pieces' pnl as the journal reports it (before fees)"
  fees:
    open_per_contract: 0.55         # USD, the owner's own Webull figure, 2026-11-11
    close_per_contract: 0.56        # USD, the same; about 1.11 a round trip (commission 0.50 + regulatory, OCC, SEC)
    expired_close: 0                # a piece left to expire (close: expired) pays no closing fee
    source: "the owner, in session, 2026-11-11; an estimate that can drift by a cent"
    change: >-
      a dated amendment to DEC-0045; does not restart the window (net and gross are recomputable from the journal)
    fees_included: >-
      the subtraction assumes the journal's fees_included is false or null; a journal with it true ends the window
      (an importer change)
  net_pnl: gross_pnl - fees
  R25: net_pnl / (0.25 * cost)      # rule 5's cap: -1 is the -25% stop (a little below it, by the fees)
  R50: net_pnl / 50                 # rule 4's risk, RISK_PER_TRADE
  primary: R25
  also_reported: [R50, R25 before fees, R50 before fees]

labels:
  method: end_of_day_replay         # never the live server log of DEC-0044
  inputs: [the stored edition for the session, the session's settled 2-minute IEX bars, the journal]
  engine:
    files:                          # in dashboard/src/lib/
      - trade-state.ts
      - trade-now.ts
      - entry-checks.ts
      - focus-plan.ts
      - options.ts
    engine_version: a content hash of those files in the release that first writes labels
    frozen_copy: >-
      the replay runs a frozen copy of those files; later changes to the desk (a DEC-0041 removal among them) do not
      reach the labels
    written: once per session, never worked out again
    other_engine_version: excluded_and_counted
  frozen_numbers:                   # the values in the engine at registration (DEC-0035 section 3)
    ENTRY_ATR: 0.01
    STOP_ATR: 0.1
    MIN_ROOM_MULTIPLE: 2
    RETEST_ATR: 0.1
    MAX_BARS_TO_RETEST: 6
    ALT_LIVE_BARS: 3
    ALT_MAX_ATR: 1
    FAIL_WITHIN_BARS: 3
    SWEEP_MIN_ATR: 0.25
    FIRST_ENTRY_MIN: "09:35"
    LUNCH: ["11:30", "13:00"]
    FLAT_MIN: "15:10"
    CLOSE_GRACE_MS: 5000
    IV_CAP_INDEX: 0.35
    IV_CAP_SINGLE: 0.7
    LATE: ["11:00", "14:30"]
    MAX_TRADES_PER_DAY: 5
  evaluation:
    when: once per 2-minute bar, at now = the bar's end + CLOSE_GRACE_MS
    function: nameState
    inputs_from: only bars that ended at or before now
    quote: >-
      day: the session; price: the last close; open: the first bar's open; high and low: the highest high and lowest
      low since the open; prev_close: null; at: now
    leader_quote: >-
      built the same way from SMH's bars, vwap the volume-weighted mean of the bars' own VWAPs; stored bars without
      volume leave the leader check unknown
    bars: Bars2m from the settled bars alone; receivedAt = now
    won_today: from the journal pieces closed before now that New York day
    day_limit_used: >-
      from the journal pieces closed before now that day (for the loss) and the buy fills before now that day (for
      the cap: each distinct opened_at of one contract is one entry, so one buy sold in parts counts once)
  side_state: >-
    nameState(...)[side].state while the row's state is neither no_trade nor paused, and no_trade otherwise; it holds
    from now until the next evaluation
  intervals: half-open, [from, until)
  side: the position's own (call side for a call, put side for a put)
  order:                            # the first that applies
    - label: no_record
      when: >-
        the session's stored edition is missing; or the symbol's (or, for the leader check, SMH's) settled bars from
        09:30 to the bar holding t0 are not complete (since after the open, or gaps above 0); or the position's side
        at t0 carries gap or brokeEarlier
    - {label: not_focus, when: "the symbol is not a focus name in that session's edition"}
    - {label: in_zone, when: "t0 lies in an enter_zone interval extended by 60 s at its end, [from, until + 60 s)"}
    - {label: early, when: "t0 lies in a get_ready interval"}
    - label: alt
      when: >-
        some side of that name at t0 has alt non-null with alt.side equal to the position's kind, live as altAt with
        its live check
    - {label: off_plan, when: otherwise}
  zone_extend_s: 60
  on_plan: [in_zone, early]
  cautions:                         # HYP-0049: entryChecks(input, kind) at now = t0, inputs built as in evaluation
    counted: [range, gap, leader, iv, late, winner]
    all_returned_count: true        # not only the two the desk shows
    not_counted: [before10]         # the desk-only early caution of DEC-0043
    no_caution_with_unknown: excluded_and_counted
  windows:                          # HYP-0050, New York, full sessions only
    open_window: ["09:35", "10:00"] # from, before
    mid_window: ["10:00", "11:30"]
    half_days: excluded             # as dashboard/src/lib/market-calendar.json marks them

window:
  start: >-
    the first New York session after the release that first writes labels reaches production; before that release
    no one runs the labeller on the owner's journal
  backfill: never
  ends_early_on:
    - an amendment to DEC-0035
    - a change to the value of a rule limit in dashboard/src/lib/trade-rules.ts (a rename or moved code is not one)
    - a change to how the journal importer matches fills
    - a journal with fees_included true
  last_session_on_early_end: the last full session before the change reaches production
  close_date: "2027-11-11"

gate:                               # the same for all three trials; each trial is read on its own
  min_positions_per_group: 30
  min_sessions: 20                  # the distinct New York days of t0 of the positions in either group
  max_positions_per_group: 150
  cap_rule: >-
    a group's members are its first 150 positions by t0 (ties by contract key, then by the first piece's id) among
    positions with no open lot; the rest are not taken
  measure: difference in mean R25 (net), a minus b
  sessions: >-
    the distinct New York dates of t0 of the positions in either group (after the cap), sorted ascending
  resample: >-
    by session: each resample draws n_sessions sessions with replacement; every position of a drawn session comes
    with it
  resamples: 5000
  empty_group: >-
    a resample with an empty group is discarded and not counted; resampling continues until 5,000 are kept; the
    generator runs on through discarded draws
  prng: mulberry32                  # portable 32-bit generator, so the result can be reproduced
  prng_step:
    - a = (a + 0x6D2B79F5) >>> 0
    - t = imul(a ^ (a >>> 15), a | 1)
    - t ^= t + imul(t ^ (t >>> 7), t | 61)
    - next = (t ^ (t >>> 14)) >>> 0
  seed: 20261111                    # the initial a; reseeded for each trial
  draw_index: floor(u * n_sessions), u = next() / 2**32
  interval: [2.5, 97.5]
  percentile: >-
    on the 5,000 sorted differences d: h = (N - 1) * p / 100; q = d[floor(h)] + (h - floor(h)) *
    (d[floor(h) + 1] - d[floor(h)]) (numpy's linear)
  halves: >-
    pool both groups' positions, sort by t0 (ties by contract key, then by the first piece's id), split at floor(n/2);
    in each half work out mean(a) - mean(b); a half with an empty group fails the condition
  pass: the whole 95% range above 0, and the difference above 0 in each half
  level: one-sided 2.5% per trial, no correction across the three
  read: once, at the first of both groups at 150, the window ending, or the close date
  falsified: "minimums met and the pass condition not met"
  inconclusive: "fewer than 30 positions in a group or fewer than 20 sessions when read"
  report_sign: the report gives the sign of the point estimate beside the verdict
  computed_by: only the verdict script computes group statistics; the site shows its report after the verdict

site_before_verdict:
  may_show:
    - per-position label
    - per-position R
    - count per label
    - overall mean R, once there are 20 positions over 10 sessions
    - average winner and average loser in R, under the same minimum
    - rules-kept score
    - progress toward the gate
    - >-
      over all positions and never by label: count of losers past the -25% stop, count of losers held past the chart
      stop, count of winners closed before target 1, count of winners closed under +50% on premium, count of
      positions where a part was held past -25%, dollars lost beyond the -25% stop
  may_not_show:
    - mean R, dollars, win rate or profit factor by label, by caution or by time window
    - what-if P&L of an exit not taken, other than the rule 5 figure above (never what a winner would have made if held)
  note: >-
    per-position views allow informal summing, and the shown figures, including the overall mean, let a group's
    result be guessed; only the aggregate is sealed

report: "written once into this folder by the verdict script the code pull request adds; it refuses to overwrite"
