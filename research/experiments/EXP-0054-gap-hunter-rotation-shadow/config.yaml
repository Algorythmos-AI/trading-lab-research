# EXP-0054: Gap Hunter with rotation to the highest-ranked tier-2 name with a valid order (DEC-0076).
# A forward experiment: in shadow (journal only) until switched on, then paper. No development-span or holdout data is read.
experiment: EXP-0054
status: registered              # DEC-0076 accepted; the shadow (runner_s, `rotation_shadow` rows) counts from its first session on the host at or after the acceptance
decision: DEC-0076
hypotheses: [HYP-0072]
trials: 1                       # family S, now 4; the global count stays at 87
question: >
  In shadow: how often does resting the best-ranked tier-2 name with a valid order give an order, and an attempt,
  on sessions where HYP-0071's primary gives none? Once switched on: what is the mean R per closed trade?
driver: python -m wt.live.runner_s            # job paper-s; the shadow runs beside HYP-0071 in the same session
book: research/experiments/EXP-0051-sleeve-s-paper-book/config.yaml   # the same book, limits, day stop and stop rule (DEC-0066)
inputs:
  pool: data/candidates_live/<session>.parquet   # the 09:25 pool, as HYP-0071 reads it (runner_s.POOL_DIR)
  pm_bars: data/pm_bars_live/<session>.parquet   # each tier-2 name's saved pre-market bars (runner_s.PM_BARS_DIR)
  journal: data/live/smallcap_journal.jsonl   # PRIVATE; on the host, never in git
  market_data: Alpaca, SIP named on every stock request (DEC-0064)
first_session: the first session at or after DEC-0076's acceptance in which the shadow's code runs on the host   # 2026-11-23 is excluded (DEC-0076 "Disclosure")
shadow:                         # counts only: no R, no P&L, no exit, no price after an attempt
  sessions_max: 20
  measures:
    - sessions; sessions where HYP-0071's primary had a valid order; sessions where the rotation rule had one
    - sessions where the resting order was in a name other than rank 1, by rank
    - minutes with a resting order, by rank and by rule code
    - attempts (a bar reached the resting order); attempts the engine would fill; attempts the spread must refused
    - sessions where both rules made an attempt, and whether it was the same name and bar
  switch_on: a dated note in DEC-0076, after the owner has seen at least 10 sessions of these counts
measures:                       # from the switch-on: as EXP-0053
  primary: mean R per closed trade, 95% bootstrap interval, sessions resampled (HYP-0072)
  cost_haircut: DEC-0074's H1 and H2, reported beside paper R, gating nothing
  selection:
    - sessions with an order, by the rank of the name; with a fill
  execution:
    - fill minus trigger, and fill against the NBBO journaled at the decision, in cents and in R
    - signals blocked, by blocker
reports:
  never: [a setup name, a headline, a catalyst category]   # AGENTS.md data classes; trials are named by id
