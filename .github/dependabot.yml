# From Algorythmos-AI/.github templates/dependabot.yml, adapted for a research repo with frozen strategies.
version: 2
updates:
  # Runtime packages (pandas, numpy, alpaca-py, ...) change the numerics of frozen strategies mid-way through a
  # forward record, so version updates are off (limit 0). Dependabot *security* updates still open PRs; they are
  # never auto-merged, and a runtime bump needs a decision record in research/decisions/.
  - package-ecosystem: pip
    directory: /
    target-branch: main
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    open-pull-requests-limit: 0
  # The dashboard (Next.js on Vercel) is not part of any frozen strategy. One grouped PR a month keeps it current;
  # security updates open as they appear. Every merge to main is a production deploy, so it waits for the gate.
  - package-ecosystem: npm
    directory: /dashboard
    target-branch: main
    schedule: { interval: monthly, timezone: Australia/Sydney }
    open-pull-requests-limit: 2
    groups:
      dashboard: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
