# From Algorythmos-AI/.github templates/dependabot.yml, adapted for a research repo with frozen strategies.
version: 2
updates:
  # Runtime packages (pandas, numpy, alpaca-py, ...) change the numerics of frozen strategies mid-way through a
  # forward record, so version updates are off (limit 0). Dependabot *security* updates still open PRs; they are
  # never auto-merged, and a runtime bump needs a decision record in research/decisions/.
  - package-ecosystem: pip
    directory: /
    target-branch: main
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    open-pull-requests-limit: 0
  # The dashboard (Next.js on Vercel) is not part of any frozen strategy. One grouped PR a month keeps it current;
  # security updates open as they appear. Every merge to main is a production deploy, so it waits for the gate.
  - package-ecosystem: npm
    directory: /dashboard
    target-branch: main
    schedule: { interval: monthly, timezone: Australia/Sydney }
    open-pull-requests-limit: 2
    groups:
      dashboard: { patterns: ["*"] }
    # Majors the toolchain can't take yet (#39 failed lint on all three): TypeScript 7 (typescript-eslint doesn't
    # support it), ESLint 10 (eslint-config-next 16 targets ESLint 9), and @types/node past the Node 22 runtime.
    # Minor and patch updates still come. Lift a line in the PR that moves the toolchain to that major.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
