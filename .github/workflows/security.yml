name: security

on:
  pull_request:
  push:
    branches: [main, integration]
  schedule:
    - cron: "0 20 * * 0" # weekly, Monday 06:00 Sydney

permissions:
  contents: read

jobs:
  security:
    uses: Algorythmos-AI/.github/.github/workflows/security.yml@1078ed679bed88c7a41744cda79aa505eb4ff277
    with:
      semgrep: false

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Every dependency is pinned, so audit the pins directly instead of resolving a temporary environment.
      # The auditor is pinned too, like every other tool CI runs (actionlint in ci.yml).
      - run: uvx pip-audit@2.9.0 --strict --disable-pip --no-deps -r requirements.lock.txt -r requirements-dev.lock.txt
      # The dashboard's production dependencies, from the lockfile (no install needed).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json
      - name: pnpm audit (production dependencies, high and critical)
        working-directory: dashboard
        run: pnpm audit --prod --audit-level high
