name: infra

# The OCI host's infrastructure as code (deploy/oci, ADR 0004): Terraform format and validation, and shellcheck
# on the host scripts. Not a required check; it runs when the infrastructure changes.
on:
  pull_request:
    paths: ["deploy/oci/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["deploy/oci/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: terraform and shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The version OCI Resource Manager applies with (1.5.x is its newest), so CI validates what production runs.
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Format
        working-directory: deploy/oci/terraform
        run: terraform fmt -check -recursive -diff
      - name: Validate (no backend, no credentials)
        working-directory: deploy/oci/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Shellcheck the host scripts
        run: shellcheck -x deploy/oci/bin/*
