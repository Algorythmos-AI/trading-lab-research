name: dashboard

# The status dashboard (dashboard/, Next.js on Vercel). Not a required check: it only runs when the dashboard or
# its contract changes (docs-only commits never rebuild, org decision D-018).
#
# Deploys are prebuilt here and uploaded with `vercel deploy --prebuilt`; the Vercel Git integration is not
# connected, so Vercel never clones this repository (ADR 0001). Every push to main that touches the dashboard or
# its contract deploys to production through the `production` Environment; pull requests only run the checks.
on:
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml", "src/wt/ops/publish.py"]
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml", "src/wt/ops/publish.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  # Never cancel a production deploy half way; superseded pull-request runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Not secret, but infrastructure identifiers stay out of git (plan v7): GitHub variables, set by the owner.
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@59.7.0

defaults:
  run:
    working-directory: dashboard

jobs:
  check:
    name: dashboard checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contract is current (TS types regenerate from the committed schema with no diff)
        run: |
          pnpm gen:types
          git diff --exit-code -- src/lib/snapshot.types.ts
      - run: pnpm build
        env:
          DASHBOARD_FIXTURE: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DASHBOARD_FIXTURE: "1"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: dashboard/playwright-report
          retention-days: 7

  deploy:
    name: deploy (production)
    needs: check
    # Production only: pushes to main and manual runs on main (owner decision, 2026-09-29: deploy on merge).
    # The `production` Environment allows only the main branch, so its secrets never reach another ref, not even
    # a pull request that edits this file. PR preview deploys were removed: previews must not hold production data.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require the deploy secrets
        # Runs before checkout: dashboard/ (the workflow default) does not exist yet.
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_BYPASS" != "true" ]; then
            echo "::error::The production Environment needs VERCEL_TOKEN and VERCEL_AUTOMATION_BYPASS_SECRET (docs/runbooks/dashboard-deploy.md). Main is NOT deployed."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set the GitHub variables VERCEL_ORG_ID and VERCEL_PROJECT_ID (docs/runbooks/dashboard-deploy.md). Main is NOT deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install the Vercel CLI (pinned, no install scripts)
        run: npm install --global --ignore-scripts "$VERCEL_CLI"
      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (stamped with this commit; no token)
        env:
          BUILD_SHA: ${{ github.sha }}
        run: vercel build --prod
      - name: Deploy the prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed to production: $url (Vercel login required)" >> "$GITHUB_STEP_SUMMARY"
      - name: The live dashboard reports this commit
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          HEALTH_URL: https://lab.algorythmos.com/api/health
        run: |
          want="${GITHUB_SHA::12}"
          got=""
          for _ in $(seq 1 18); do
            got=$(curl -fsS -H "x-vercel-protection-bypass: $BYPASS" "$HEALTH_URL" \
                  | python3 -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))' || true)
            if [ "$got" = "$want" ]; then
              echo "Live /api/health reports $got." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live /api/health reports '$got', expected $want: the deploy did not take effect."
          exit 1
