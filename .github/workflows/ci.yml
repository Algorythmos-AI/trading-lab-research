name: ci

# Required check on main (repo ruleset). Keep the job name `test` stable and never add path filters here:
# a required check that does not run leaves pull requests waiting forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the locked environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --require-hashes --python .venv/bin/python -r requirements.lock.txt
          if [ -f requirements-dev.lock.txt ]; then uv pip install --require-hashes --python .venv/bin/python -r requirements-dev.lock.txt; fi
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Lint workflows (actionlint + shellcheck)
        # Pinned; tests/unit/test_workflows.py adds the project rules actionlint can't see.
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color
      - name: Type-check new modules (mypy)
        run: make typecheck PY=.venv/bin/python
      - name: Dashboard contract is current (schema and thresholds regenerate with no diff)
        run: |
          make schema PY=.venv/bin/python
          git diff --exit-code -- dashboard/src/lib/snapshot.schema.json dashboard/src/lib/thresholds.gen.ts
      - name: Unit tests
        run: .venv/bin/python -m pytest
