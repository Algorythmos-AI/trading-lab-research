name: ci

# Required check on main (repo ruleset). Keep the job name `test` stable and never add path filters here:
# a required check that does not run leaves pull requests waiting forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Install the locked environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.lock.txt
          if [ -f requirements-dev.lock.txt ]; then uv pip install --python .venv/bin/python -r requirements-dev.lock.txt; fi
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Type-check new modules (mypy)
        run: make typecheck PY=.venv/bin/python
      - name: Unit tests
        run: .venv/bin/python -m pytest
