name: ci

# Required checks on main (repo ruleset): `test` and `dashboard-gate`. Keep both job names stable and never add
# path filters to this workflow: a required check that does not run leaves pull requests waiting forever.
# dashboard-gate always runs and decides for itself whether the dashboard's checks apply (deploy/contract-paths.txt).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull-request run may be cancelled. Every commit on main keeps its full result: a deploy takes only a
  # main commit whose checks all succeeded (wt.ops.ci), and a cancelled run is not a success.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the locked environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --require-hashes --python .venv/bin/python -r requirements.lock.txt
          if [ -f requirements-dev.lock.txt ]; then uv pip install --require-hashes --python .venv/bin/python -r requirements-dev.lock.txt; fi
      - name: The locked environment installs on the Linux ARM64 VM (hash-checked, no download)
        run: |
          uv pip install --dry-run --require-hashes --no-deps --python-platform aarch64-unknown-linux-gnu \
            --python-version 3.12 --target "$RUNNER_TEMP/arm64" -r requirements.lock.txt
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Lint workflows (actionlint + shellcheck)
        # Pinned; tests/unit/test_workflows.py adds the project rules actionlint can't see.
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color
      - name: Type-check new modules (mypy)
        run: make typecheck PY=.venv/bin/python
      - name: Dashboard contract is current (schema and thresholds regenerate with no diff)
        run: |
          make schema PY=.venv/bin/python
          git diff --exit-code -- dashboard/src/lib/snapshot.schema.json dashboard/src/lib/crypto.schema.json dashboard/src/lib/thresholds.gen.ts
      - name: Unit tests
        run: .venv/bin/python -m pytest

  dashboard-gate:
    name: dashboard-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does this change touch the dashboard contract?
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "no usable base: running the dashboard checks"; exit 0
          fi
          mapfile -t globs < <(grep -v -E '^\s*(#|$)' deploy/contract-paths.txt)
          args=()
          for g in "${globs[@]}"; do args+=(":(glob)$g"); done
          if git diff --quiet "$base"...HEAD -- "${args[@]}"; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"; echo "no dashboard or contract change: nothing to check"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"; git diff --name-only "$base"...HEAD -- "${args[@]}"
          fi
      - if: steps.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json
      - if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Dashboard checks (lint, types, unit tests, contract, build, e2e)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: dashboard
        env:
          DASHBOARD_FIXTURE: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm gen:types
          git diff --exit-code -- src/lib/snapshot.types.ts src/lib/crypto.types.ts
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
