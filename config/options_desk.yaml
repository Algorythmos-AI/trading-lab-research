# The Options desk's names. They are the names the after-close edition carries; the host job that reads open
# interest (wt.options.live) uses the same list.
names: [SPY, QQQ, AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, PLTR]

# The edition format the after-close run sends (scripts/options_edition.py). 1 is what the dashboard has always
# received. 2 adds the day's context, scheduled events and each name's volatility block; it is the owner's switch,
# flipped after a shadow night. Whatever is set here, the script sends 1 to a dashboard that does not accept 2.
edition_format: 1

# Whether the host job works out, during the session, where each probation rule stands (wt.options.live):
#   off    not worked out, nothing sent
#   log    worked out and sent to the dashboard; a rule that triggers is written to the job's log only
#   phone  the same, and a rule that triggers also pages the owner's phone (name and rule, never a price)
# The owner's switch. It stays on `log` for a week before `phone`.
rule_alerts: log

# Whether the host job also sends each name's hourly bars for the last five sessions (wt.options.live), for the
# map's hourly range. Sent only to a dashboard that accepts them. The owner's switch.
hourly_bars: true

# The broker's contract id for the volatility index (VIX), or null. When set and the after-close routine pulls a
# year of its daily bars, edition format 2 carries the index's close, change and place in its year. Null: left out.
vix_contract: null

# The broker's contract id for each name's stock: how the edition builder tells one pull from another when it
# reads them out of a session transcript (scripts/options_edition.py --transcript). Public identifiers.
contracts:
  SPY: 756733
  QQQ: 320227571
  AAPL: 265598
  MSFT: 272093
  NVDA: 4815747
  AMZN: 3691937
  GOOGL: 208813719
  META: 107113386
  TSLA: 76792991
  PLTR: 444857009
