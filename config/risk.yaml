# Hard pre-trade limits (wt.risk.pretrade), per strategy. Independent of the virtual account's sizing.
# Frozen per gate: changing a limit that can block an entry resets the gate's counters and needs a decision record.
B:
  allowlist: [QQQM]            # B trades QQQM only (signals come from QQQ)
  max_qty: 10                  # the US$600 virtual account sizes 1-3 shares; 10 is a hard ceiling
  max_notional: 2000           # US$, per order
  max_entries_per_day: 1       # plan: at most one trade per day
  max_orders_per_day: 20       # entry + stop + resizes + exits + re-stops; a runaway loop hits this
  # log-only checks (never block B; see the module docstring)
  max_quote_age_s: 5
  max_collar_pct: 0.5
  max_spread_pct: 0.15

# Crypto desk (ADR 0005, DEC-0012), read by wt.crypto.risk. Amounts are US$ on the paper book. Sizes are
# fractional, so the ceiling is notional, not a share count.
C:
  allowlist: [BTC/USD, ETH/USD, SOL/USD]
  max_notional: 50             # US$ per entry
  max_open_exposure: 500       # US$ across all open positions
  max_entries_per_day: 3       # per UTC day
  max_orders_per_day: 20
  daily_loss_latch: 20         # US$ realised loss in a UTC day; entries stay off until the owner resets it

# The crypto tournament sleeves (DEC-0015), read by wt.crypto.risk. Per sleeve, as a share of that sleeve's own
# paper book, so the limits keep their meaning as a book grows or shrinks. Key C above is HYP-0020's and unchanged.
CT:
  risk_pct: 1.0                # of equity risked per trade; quantity = risk / stop distance
  max_position_pct: 30         # of equity in one position (a tight stop is capped here and risks less)
  max_exposure_pct: 100        # of equity across open positions: no leverage
  max_positions: 3
  max_entries_per_day: 4       # per UTC day
  max_orders_per_day: 20
  daily_loss_latch_pct: 3      # realised loss in a UTC day; entries stay off for the sleeve until the owner resets it
