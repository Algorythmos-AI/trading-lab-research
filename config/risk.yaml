# Hard pre-trade limits (wt.risk.pretrade), per strategy. Independent of the virtual account's sizing.
# Frozen per gate: changing a limit that can block an entry resets the gate's counters and needs a decision record.
B:
  allowlist: [QQQM]            # B trades QQQM only (signals come from QQQ)
  max_qty: 10                  # the US$600 virtual account sizes 1-3 shares; 10 is a hard ceiling
  max_notional: 2000           # US$, per order
  max_entries_per_day: 1       # plan: at most one trade per day
  max_orders_per_day: 20       # entry + stop + resizes + exits + re-stops; a runaway loop hits this
  # log-only checks (never block B; see the module docstring)
  max_quote_age_s: 5
  max_collar_pct: 0.5
  max_spread_pct: 0.15
  # The pre-registered stop (DEC-0037): entries stop, as a latch that only a decision record clears, when any of
  # these holds. Read by wt.risk.stop_rule at arming time and printed by the weekly scorecard.
  stop_rule:
    decision: DEC-0037
    cum_r_max_loss: -6.0        # cumulative R over B's closed trades with a real exit
    review_at_trades: 30        # at this many trades, stop if the bootstrap CI95 upper bound of E[R] is below zero
    stop_date: 2027-01-30       # whatever the count is by then

# Robot B's sleeve S, the stock desk's paper book (DEC-0066 section 3). Read by wt.live.runner_s on its own paper
# account. The session's allowlist is built at run time from the day's scan, so the list here is empty.
S:
  allowlist: []
  max_qty: 600
  max_notional: 700            # US$, per order
  max_entries_per_day: 6
  max_orders_per_day: 60
  # Blocking for sleeve S (DEC-0066 section 3 says quote age blocks; the number is proposed by the note of
  # 2026-11-19 in that record and takes effect with it).
  max_quote_age_s: 10
  # The stop rule (DEC-0066 section 4), on sleeve S's own journal.
  stop_rule:
    decision: DEC-0066
    cum_r_max_loss: -6.0
    review_at_trades: 30
    stop_date: 2027-03-31

# The crypto desk's keys (C, CT, CD, CH) left with its code (DEC-0036); git history keeps them.

# The options clone (DEC-0030), read by wt.risk.options_guard. Amounts are US$ on the paper account. One contract,
# long only: the premium is the most a trade can lose. Frozen with config/options_clone.yaml.
O:
  max_contracts: 1             # per order and per position
  max_premium: 1500            # US$ per contract (limit x 100); with the 25% stop the planned loss is $375 (DEC-0039)
  max_limit_price: 15.00       # the same cap, per share of the contract
  max_entries_per_day: 5       # filled entries, winners and scratches included
  max_attempts_per_name: 2     # filled entries in one underlying per day
  max_orders_per_day: 40       # entries, targets, stops, exits, cancels: a runaway loop hits this
  max_open_positions: 1
  day_loss_latch: 750          # US$ (DEC-0039: scaled 7.5x with the cap), realised plus marked open; entries off for the day
  week_loss_latch: 2250        # US$, Monday to Friday; entries off until the owner resets it
  drawdown_latch: 3750         # US$ from the high-water mark of the clone's own P&L; off until the owner resets it
